/* 把顶栏实际高度写进 CSS 变量，供搜索框的吸顶位置使用。
   高度会随字号、安全区、横竖屏变化，所以不能写死。 */
function syncHeaderHeight() {
  const h = document.querySelector('.app-header');
  if (h) document.documentElement.style.setProperty('--header-h', h.offsetHeight + 'px');
}
addEventListener('resize', syncHeaderHeight);
addEventListener('orientationchange', () => setTimeout(syncHeaderHeight, 150));

/* ---------- Tab 1 打饭台 ----------
   搜索框只建一次，之后敲字只重画下面的列表。
   每敲一个字就重建输入框的话，中文拼音输入法的联想会被打断。 */
function renderServe() {
  const main = $('main');
  if (main.dataset.view !== 'serve') {
    main.dataset.view = 'serve';
    main.innerHTML = `<div class="search-bar">
      <input id="searchInput" type="search" placeholder="搜索姓名、拼音首字母或小组" value="${esc(state.search)}"
        autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
      <div id="groupBar"></div>
    </div><div id="serveList"></div>`;

    bindSearchInput($('searchInput'), v => { state.search = v; renderServeList(); });   // 只换列表，输入框原地不动
  }
  renderGroupBar();
  renderServeList();
}

/* 搜索框：输入法正在联想（拼音还没选字）时先不过滤；
   手机键盘上的「搜索」键收起键盘，好看清名单（输入法选字时按的回车不算） */
function bindSearchInput(input, onChange) {
  let composing = false;
  input.addEventListener('compositionstart', () => { composing = true; });
  input.addEventListener('compositionend', e => { composing = false; onChange(e.target.value); });
  input.addEventListener('input', e => { if (!composing) onChange(e.target.value); });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) input.blur();
  });
}

/* 打饭台只列有饭卡的人（名册里的人不一定都留下来吃饭，名单短了找人快）：
   - 使用中的卡（包括还没付钱的）；
   - 今天刚用完的卡留到今天结束：点错了还能撤销，当场买新卡也方便；第二天就不显示了；
   - 没有饭卡的人：搜名字时列在下面，点「开卡」以后就出现在打饭台上（或者在「名册」里开卡） */
function serveCardOf(m) {
  const c = currentCardOf(m.id);
  if (!c) return null;
  if (c.status === 'ACTIVE') return c;
  const us = usagesOf(c.id);
  return c.status === 'EXHAUSTED' && us.length && us[us.length - 1].used_date === todayStr() ? c : null;
}
const serveMembers = () => activeMembers().filter(m => serveCardOf(m));
const groupsOf = list => [...new Set(list.map(groupOf).filter(Boolean))].sort(compareGroups);
/* 选着的小组里已经没有人有饭卡了（比如最后一个人的卡用完了，或者刚导入的新组还没人开卡）：回到「全部」。
   不然列表是空的，上面又没有那个小组的按钮可以点回来。改了就返回 true */
function checkServeGroup(holders) {
  if (!state.group) return false;
  const ok = state.group === '__none__'
    ? holders.some(m => !groupOf(m)) && groupsOf(holders).length > 0
    : holders.some(m => groupOf(m) === state.group);
  if (!ok) state.group = '';
  return !ok;
}
function renderGroupBar() {
  const bar = $('groupBar');
  if (!bar) return;
  const holders = serveMembers();
  checkServeGroup(holders);
  const groups = groupsOf(holders);
  if (!groups.length) { bar.innerHTML = ''; bar.className = ''; return; }
  const hasUngrouped = holders.some(m => !groupOf(m));
  const chip = (val, label) =>
    `<button class="group-chip${state.group === val ? ' active' : ''}" data-group="${esc(val)}">${esc(label)}</button>`;
  bar.className = 'group-bar';
  bar.innerHTML = chip('', '全部') + groups.map(g => chip(g, g)).join('')
    + (hasUngrouped ? chip('__none__', '未分组') : '');
  bar.querySelectorAll('[data-group]').forEach(b =>
    b.addEventListener('click', () => { state.group = b.dataset.group; renderGroupBar(); renderServeList(); }));
}

function renderServeList() {
  const listEl = $('serveList');
  if (!listEl) return;
  const q = state.search.trim().toLowerCase();
  const holders = serveMembers();
  if (checkServeGroup(holders)) renderGroupBar();
  const groups = groupsOf(holders);
  const hit = m => !q || (m.name || '').toLowerCase().includes(q)
       || (m.pinyin || '').toLowerCase().includes(q)
       || groupOf(m).toLowerCase().includes(q);
  // 一开始搜索就跨小组找：要不然人在别的组，搜了半天搜不到，打饭现场最耽误事
  const list = (q ? holders : filterByGroup(holders)).filter(hit);
  // 搜名字时，名册里还没有饭卡的人也列出来（放在下面），点「开卡」就能吃
  const othersAll = q ? activeMembers().filter(m => !serveCardOf(m) && hit(m)) : [];
  const others = othersAll.slice(0, 8);

  const items = [];                 // 每一项对应列表里的一个元素：{ key, html }
  if (!list.length && !others.length) {
    const msg = activeMembers().length === 0
      ? '还没有成员。<br>切到「名册」页添加第一个人，或批量导入名单。'
      : q ? '没有找到匹配的成员'
      : !holders.length ? '还没有人开饭卡。<br>要在这里吃饭的人，到「名册」点他名字右边的「开卡」，<br>或者在上面搜他的名字。'
      : '这个小组还没有人开饭卡';
    items.push({ key: 'empty', html: `<div class="empty-state">${msg}</div>` });
  } else {
    // 看「全部」且没在搜索时，插入小组分隔标题；人一多，滚动时靠它定位
    const showHeads = !q && !state.group && groups.length > 0;
    const headCount = {};
    if (showHeads) for (const m of list) { const h = groupOf(m) || '未分组'; headCount[h] = (headCount[h] || 0) + 1; }
    let lastHead = null;

    for (const m of list) {
      if (showHeads) {
        const head = groupOf(m) || '未分组';
        if (head !== lastHead) {
          lastHead = head;
          items.push({ key: 'h:' + head, html: `<div class="roster-group-head serve-group-head">${esc(head)}（${headCount[head]}）</div>` });
        }
      }
      const card = currentCardOf(m.id);
      const used = card && card.status === 'EXHAUSTED';
      let badge, punches = '';
      if (card) {
        badge = card.is_paid
          ? `<button class="badge badge-paid" data-toggle-paid="${esc(card.id)}">已付</button>`
          : `<button class="badge badge-unpaid" data-toggle-paid="${esc(card.id)}">未付 · 点此改</button>`;
        const us = usagesOf(card.id);
        for (let i = 0; i < 5; i++) {
          if (i < us.length) {
            punches += `<div class="punch filled${us[i]._pending ? ' pending' : ''}" data-usage="${esc(us[i].id)}">${esc(fmtShort(us[i].used_date))}</div>`;
          } else if (i === us.length && card.status === 'ACTIVE') {
            punches += `<div class="punch next" data-punch-card="${esc(card.id)}" data-punch-member="${esc(m.id)}">+</div>`;
          } else {
            punches += `<div class="punch disabled">·</div>`;
          }
        }
      } else {
        badge = '<span class="badge badge-none">无饭卡</span>';
      }
      // 已按小组筛选、或上面已有分组标题时就不用重复标；
      // 但搜索是跨小组的，这时必须标出来才知道人在哪组
      const groupTag = (!showHeads && (q || !state.group) && groupOf(m))
        ? `<span class="member-group">${esc(groupOf(m))}</span>` : '';
      items.push({ key: 'm:' + m.id, html: `<div class="member-row${used ? ' exhausted' : ''}">
        <div class="member-top">
          <div class="member-name-wrap"><span class="member-name">${esc(m.name)}</span>${groupTag}${badge}</div>
          ${!card || used ? `<button class="quick-issue-btn" data-issue="${esc(m.id)}">+ ${used ? '开新卡' : '开卡'}</button>` : ''}
        </div>
        ${card ? `<div class="punches">${punches}</div>` : ''}
      </div>` });
    }
    if (others.length) {
      items.push({ key: 'h:nocard', html: `<div class="roster-group-head serve-group-head">名册里没有饭卡的（点「开卡」就能用）</div>` });
      for (const m of others) {
        const last = currentCardOf(m.id);
        items.push({ key: 'n:' + m.id, html: `<div class="member-row nocard">
          <div class="member-top">
            <div class="member-name-wrap"><span class="member-name">${esc(m.name)}</span>${groupOf(m) ? `<span class="member-group">${esc(groupOf(m))}</span>` : ''}<span class="badge badge-none">${last ? '上一张已用完' : '没有饭卡'}</span></div>
            <button class="quick-issue-btn" data-issue="${esc(m.id)}">+ ${last ? '开新卡' : '开卡'}</button>
          </div></div>` });
      }
      if (othersAll.length > others.length)
        items.push({ key: 'more', html: `<div class="list-meta serve-more">还有 ${othersAll.length - others.length} 个没有饭卡的人也对得上，名字再多打几个字</div>` });
    }
    if (!q && holders.length < activeMembers().length)
      items.push({ key: 'note', html: `<div class="stat-note serve-note">这里只列有饭卡的人。没有饭卡的：搜名字，或者到「名册」开卡。</div>` });
  }

  // 只换有变化的那几行。人一多（上百人），整张列表重画在低端手机上要几百毫秒，
  // 而打一次卡、另一台手机同步过来一次，通常只改动一行。
  // 列表结构变了（搜索、筛选、加人、删人）才整张重画。
  const prev = listEl._items;
  const sameShape = prev && prev.length === items.length && listEl.children.length === items.length
    && prev.every((p, i) => p.key === items[i].key);
  if (sameShape) {
    items.forEach((it, i) => {
      if (prev[i].html === it.html) return;
      const tpl = document.createElement('template');
      tpl.innerHTML = it.html;
      const el = tpl.content.firstElementChild;
      listEl.children[i].replaceWith(el);
      bindServeRows(el);
    });
  } else {
    listEl.innerHTML = items.map(it => it.html).join('');
    bindServeRows(listEl);
  }
  listEl._items = items;
}

function bindServeRows(root) {
  root.querySelectorAll('[data-issue]').forEach(b =>
    b.addEventListener('click', () => openIssueFlow(b.dataset.issue)));
  // 点按由页面顶部那段整页监听统一识别。这里给每个圆圈挂一个空的 click 监听，不能删：
  // 安卓 Chrome 会把手指点的位置「吸」到附近真正可点的元素上。圆圈如果不算可点，
  // 点在靠近底部导航栏的「+」上就会被吸到导航按钮——卡没打上，页面反而跳去了名册。
  root.querySelectorAll('.punch.next, .punch.filled').forEach(el => el.addEventListener('click', noop));
  // 点「未付 / 已付」标签直接改收款状态
  root.querySelectorAll('[data-toggle-paid]').forEach(b =>
    b.addEventListener('click', () => askTogglePaid(b.dataset.togglePaid)));
}

/* 点一下已打的孔就能撤销（长按也行），不用去猜有没有隐藏手势 */
function askRevoke(id) {
  const u = state.usages.find(x => x.id === id);
  if (!u || u._pending) return;
  const who = memberById(u.member_id)?.name || '';
  showModal({
    title: '撤销这次打饭',
    bodyHtml: `撤销 <strong>${esc(who)}</strong> 在 <strong>${esc(u.used_date)}</strong> 的这次打饭记录吗？${u.created_by ? `（${esc(u.created_by)} 打的卡）` : ''}次数会退回这张卡。`,
    buttons: [
      { label: '不撤销', variant: 'btn-ghost', onClick: close => close() },
      { label: '确认撤销', variant: 'btn-danger', onClick: close => { close(); revokeUsage(u); } }
    ]
  });
}

function askTogglePaid(cardId) {
  const card = state.cards.find(c => c.id === cardId);
  if (!card) return;
  const name = memberById(card.member_id)?.name || '';
  if (card.is_paid) {
    showModal({
      title: '改回未付款？',
      bodyHtml: `${esc(name)} 这张卡目前是「已付20欧」。确定要改回未付款吗？`,
      buttons: [
        { label: '取消', variant: 'btn-ghost', onClick: close => close() },
        { label: '改回未付', variant: 'btn-danger', onClick: close => { close(); setPaid(cardId, false); } }
      ]
    });
  } else {
    showModal({
      title: '收到 20 欧了？',
      bodyHtml: `把 ${esc(name)} 这张卡标记为已付款。这 20 欧会算进今天的应收。`,
      buttons: [
        { label: '还没收到', variant: 'btn-ghost', onClick: close => close() },
        { label: '已收20欧', variant: 'btn-primary', onClick: close => { close(); setPaid(cardId, true); } }
      ]
    });
  }
}

/* 开卡流程：先确认要不要作废旧卡，再选收款状态。
   旧卡只在最后一步真正开卡时才作废——中途取消什么都不会变。 */
function openIssueFlow(memberId) {
  const m = memberById(memberId);
  if (!m) return;
  const existing = activeCardOf(memberId);
  const remaining = existing ? 5 - usagesOf(existing.id).length : 0;

  const choosePaid = (replaceId) => showModal({
    title: `为 ${m.name} 开通新5次卡`,
    bodyHtml: replaceId
      ? `<div style="color:var(--ink-soft)">旧卡剩下的 <strong>${remaining}</strong> 次会作废。请选择新卡 20 欧的收款状态：</div>`
      : `<div style="color:var(--ink-soft)">请选择这张卡 20 欧的收款状态。选「暂未收款」也会正常开卡，之后点名字旁的「未付」标签就能改。</div>`,
    buttons: [
      { label: '取消', variant: 'btn-ghost', onClick: close => close() },
      { label: '暂未收款', variant: 'btn-secondary', onClick: close => { close(); issueCard(memberId, false, replaceId); } },
      { label: '已收20欧', variant: 'btn-primary', onClick: close => { close(); issueCard(memberId, true, replaceId); } }
    ]
  });

  if (existing && remaining > 0) {
    showModal({
      title: `${m.name} 还有未用完的饭卡`,
      bodyHtml: `当前这张卡还剩 <strong>${remaining}</strong> 次没用。确定要作废旧卡、开一张新的吗？`,
      buttons: [
        { label: '取消', variant: 'btn-ghost', onClick: close => close() },
        { label: '作废旧卡并开新卡', variant: 'btn-danger', onClick: close => { close(); choosePaid(existing.id); } }
      ]
    });
  } else {
    choosePaid(null);
  }
}

/* ---------- Tab 2 名册 ---------- */
/* ---------- 签到页 ----------
   门口签到要快：搜拼音首字母 → 点「签到」，几点到的、准时还是迟到都自动记。
   和打饭台一样：搜索框只建一次，敲字只重画名单；名单只换有变化的那几行；
   点击都挂在外层容器上（重画也不用重新绑定）。 */
function setHtml(el, html) { if (el && el._html !== html) { el.innerHTML = html; el._html = html; } }
function renderAttend() {
  const main = $('main');
  if (main.dataset.view !== 'attend') {
    main.dataset.view = 'attend';
    main.innerHTML = `<div id="attDateBar"></div><div id="attStats"></div>
      <div class="search-bar">
        <input id="attSearch" type="search" placeholder="搜索姓名、拼音首字母或小组" value="${esc(state.attSearch)}"
          autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
        <div id="attGroupBar"></div>
      </div>
      <div id="attList"></div><div id="attFoot"></div>`;
    bindSearchInput($('attSearch'), v => { state.attSearch = v; renderAttendList(); });
    $('attDateBar').addEventListener('click', onAttDateBarClick);
    $('attDateBar').addEventListener('change', e => { if (e.target.id === 'attDatePick' && e.target.value) setAttDate(e.target.value); });
    $('attStats').addEventListener('click', e => {
      const b = e.target.closest('[data-att-filter]');
      if (b) { state.attFilter = b.dataset.attFilter; renderAttendStats(); renderAttendList(); return; }
      if (e.target.closest('#attLateBtn')) openLateModal();
      if (e.target.closest('#attLatest')) setAttDate(latestSunday(todayStr()));
    });
    $('attGroupBar').addEventListener('click', e => {
      const b = e.target.closest('[data-att-group]');
      if (!b) return;
      state.attGroup = b.dataset.attGroup;
      renderAttendStats(); renderAttendGroupBar(); renderAttendList();
    });
    $('attList').addEventListener('click', onAttListClick);
    $('attFoot').addEventListener('click', onAttFootClick);
  }
  renderAttendDateBar(); renderAttendStats(); renderAttendGroupBar(); renderAttendList(); renderAttendFoot();
}

/* 日期：‹ › 一次翻一个周日；点中间的日期弹出周日列表（手机自带的滚轮 / 下拉框） */
const attOptions = (sel, extra) => attDateChoices(extra).map(x =>
  `<option value="${x}"${x === sel ? ' selected' : ''}>${esc(fmtCn(x))}${x === todayStr() ? '（今天）' : ''}</option>`).join('');
function renderAttendDateBar() {
  const d = attDate(), t = todayStr();
  setHtml($('attDateBar'), `<div class="att-datebar">
      <button class="att-nav" id="attPrev" type="button" aria-label="上一个周日">‹</button>
      <div class="att-date">
        <span class="att-date-main">${esc(fmtCn(d))}</span><span class="att-date-sub${d === t ? ' is-today' : ''}">${esc(attAgo(d))}</span>
        <select id="attDatePick" aria-label="选别的周日">${attOptions(d, d)}</select>
      </div>
      <button class="att-nav" id="attNext" type="button" aria-label="下一个周日"${d >= latestSunday(t) ? ' disabled' : ''}>›</button>
    </div>`);
}
function onAttDateBarClick(e) {
  const d = attDate(), list = attDateChoices(d);          // 新的在前
  if (e.target.closest('#attPrev')) return setAttDate(list.find(x => x < d) || prevSunday(d));
  if (e.target.closest('#attNext')) { const n = list.filter(x => x > d).pop(); if (n) setAttDate(n); }
}
function setAttDate(d) {
  const t = todayStr();
  state.attDate = d > t ? latestSunday(t) : d;
  attAutoFor = t;
  render();
}

/* 当前小组筛选下的人（不管搜索和状态筛选）：统计按这个范围。
   已经隐藏的人，这天还算数的也列出来：这天有记录的（不然看不到、改不了），
   或者离开以前没来、算缺席的（和导出的签到表一致） */
function attPeople(d) {
  return [...activeMembers(), ...state.members.filter(m => m.active === false && attStatusFor(m, d)).sort(compareMembers)];
}
function attScope() {
  const all = attPeople(attDate());
  if (!state.attGroup) return all;
  if (state.attGroup === '__none__') return all.filter(m => !groupOf(m));
  return all.filter(m => groupOf(m) === state.attGroup);
}
/* 这一天「应该来」的人：今天（周日）是名册里的所有人；过去的日子是那天以前就在名册里的（或者这天本来就有记录的）。
   那天才加、以后才加进名册的人照样列在名单里（方便补签），但不算未签、也不算缺席 */
const expectedOn = (m, d) => !!attOf(m.id, d) || joinedOn(m) < d || (d >= todayStr() && joinedOn(m) <= d);
/* 第四格：今天还没过完、那天没聚会、不是周日，叫「未签」；周日聚会过去了，就是「缺席」 */
const attRestIsAbsent = d => d < todayStr() && weekdayOf(d) === 0 && hadMeeting(d);
function attKey(m, d) {           // present / late / rest（未签或缺席）/ ''（那时还没加入）
  const a = attOf(m.id, d);
  if (a && a.status !== 'absent') return a.status;
  return expectedOn(m, d) ? 'rest' : '';
}
function renderAttendStats() {
  const d = attDate(), t = todayStr(), last = latestSunday(t);
  const c = { all: 0, present: 0, late: 0, rest: 0 };
  for (const m of attScope()) { const k = attKey(m, d); if (k) { c.all++; c[k]++; } }
  const chip = (f, n, label, cls) =>
    `<button type="button" class="att-stat ${cls}${state.attFilter === f ? ' active' : ''}" data-att-filter="${f}"><b>${n}</b><span>${label}</span></button>`;
  const back = d !== last ? `<button type="button" class="link-btn" id="attLatest">回到${last === t ? '今天' : '上周日'}</button>` : '';
  const rule = d === t
    ? `<span>${esc(lateAfter())} 及以后签到记为「迟」</span><button type="button" class="link-btn" id="attLateBtn">改时间</button>`
    : weekdayOf(d) !== 0 ? `<span>这天不是周日（以前记的特别聚会），没签到的不算缺席</span>${back}`
    : !hadMeeting(d) ? `<span>这天还没有签到记录。没聚会就不用管，有的话点「补签」</span>${back}`
    : `<span>没签到的人自动算缺席，忘了签的点「补签」</span>${back}`;
  setHtml($('attStats'), `<div class="att-stats">
      ${chip('', c.all, '全部', 's-all')}${chip('present', c.present, '✓ 准时', 's-present')}${chip('late', c.late, '迟到', 's-late')}${attRestIsAbsent(d) ? chip('rest', c.rest, '✗ 缺席', 's-absent') : chip('rest', c.rest, '未签', 's-none')}
    </div>
    <div class="att-rule">${rule}</div>`);
}
function renderAttendGroupBar() {
  const bar = $('attGroupBar');
  if (!bar) return;
  const groups = groupList();
  if (!groups.length) { setHtml(bar, ''); bar.className = ''; return; }
  const hasUngrouped = activeMembers().some(m => !groupOf(m));
  if (state.attGroup && state.attGroup !== '__none__' && !groups.includes(state.attGroup)) state.attGroup = '';
  const chip = (val, label) =>
    `<button type="button" class="group-chip${state.attGroup === val ? ' active' : ''}" data-att-group="${esc(val)}">${esc(label)}</button>`;
  bar.className = 'group-bar';
  setHtml(bar, chip('', '全部') + groups.map(g => chip(g, g)).join('') + (hasUngrouped ? chip('__none__', '未分组') : ''));
}

/* 名单：今天（周日）右边是「签到」，一点就记下现在的时间；
   过去的周日右边是「补签」，没签到的人名字旁边自动标「✗ 缺席」 */
function renderAttendList() {
  const listEl = $('attList');
  if (!listEl) return;
  const d = attDate(), live = d === todayStr();
  const raw = state.attSearch.trim(), q = raw.toLowerCase();
  // 一开始搜索就跨小组找（和打饭台一样）
  let list = (q ? attPeople(d) : attScope()).filter(m => !q
    || (m.name || '').toLowerCase().includes(q) || (m.pinyin || '').toLowerCase().includes(q) || groupOf(m).toLowerCase().includes(q));
  if (state.attFilter) list = list.filter(m => attKey(m, d) === state.attFilter);

  const items = [];
  if (!list.length) {
    if (!activeMembers().length) {
      items.push({ key: 'empty', html: `<div class="empty-state">还没有成员。<br>点下面「新朋友」加人，或者到「名册」页批量导入名单。</div>` });
    } else if (q) {
      items.push({ key: 'empty:' + q, html: `<div><div class="empty-state">没找到「${esc(raw)}」${state.attFilter ? '（或者不在上面选的那一类里）' : ''}</div>
        ${raw.length <= 20 ? `<button type="button" class="add-btn" data-att-add="${esc(raw)}">+ 把「${esc(raw)}」加入名册并${live ? '签到' : '补签'}</button>` : ''}</div>` });
    } else {
      items.push({ key: 'empty:f', html: `<div class="empty-state">${state.attFilter === 'rest'
        ? (attRestIsAbsent(d) ? '这个范围里没有人缺席' : '这个范围里的人都签过了') : '这个范围里没有这一类的人'}</div>` });
    }
  } else {
    const showHeads = !q && !state.attGroup && groupList().length > 0;
    const heads = {};
    if (showHeads) for (const m of list) {
      const h = groupOf(m) || '未分组', a = attOf(m.id, d);
      const x = heads[h] || (heads[h] = { n: 0, come: 0 });
      if (expectedOn(m, d)) x.n++;
      if (a && a.status !== 'absent') x.come++;
    }
    let lastHead = null;
    for (const m of list) {
      if (showHeads) {
        const head = groupOf(m) || '未分组';
        if (head !== lastHead) {
          lastHead = head;
          items.push({ key: 'h:' + head, html: `<div class="roster-group-head serve-group-head">${esc(head)}（${heads[head].n}）<span class="att-head-n">到 ${heads[head].come}</span></div>` });
        }
      }
      const a = attOf(m.id, d), done = !!a && a.status !== 'absent', id = esc(m.id);
      const tag = !showHeads && groupOf(m) ? `<span class="member-group">${esc(groupOf(m))}</span>` : '';
      const hid = m.active === false ? '<span class="member-group">已隐藏</span>' : '';
      const meal = !done && ateOn(m.id, d) ? '<span class="att-meal">打过饭</span>' : '';
      const mark = !done && attStatusFor(m, d) === 'absent' ? '<span class="att-chip att-absent">✗ 缺席</span>'
        : (!a && !expectedOn(m, d) ? `<span class="member-group">${joinedOn(m) === d ? '这天才加入名册' : '那时还没加入'}</span>` : '');
      const right = done ? `<button type="button" class="att-pill ${ATT[a.status].cls}" data-att-menu="${id}">${esc(attText(a))}</button>`
        : live ? `<button type="button" class="att-in" data-att-in="${id}">签到</button>`
        : `<button type="button" class="att-fix" data-att-menu="${id}">补签</button>`;
      items.push({ key: 'm:' + m.id, html: `<div class="att-row${a && a._pending ? ' pending' : ''}">
        <button type="button" class="att-who" data-att-menu="${id}"><span class="member-name">${esc(m.name)}</span>${tag}${hid}${mark}${meal}</button>
        ${right}
      </div>` });
    }
  }
  const prev = listEl._items;
  const sameShape = prev && prev.length === items.length && listEl.children.length === items.length
    && prev.every((p, i) => p.key === items[i].key);
  if (sameShape) {
    items.forEach((it, i) => {
      if (prev[i].html === it.html) return;
      const tpl = document.createElement('template');
      tpl.innerHTML = it.html;
      listEl.children[i].replaceWith(tpl.content.firstElementChild);
    });
  } else {
    listEl.innerHTML = items.map(it => it.html).join('');
  }
  listEl._items = items;
}

function onAttListClick(e) {
  const d = attDate();
  // 搜到只剩这一个人：签完自动清空搜索框，键盘不收，接着就能搜下一个人
  const single = () => !!state.attSearch.trim() && $('attList').querySelectorAll('.att-row').length === 1;
  const clearSearch = () => {
    state.attSearch = '';
    const i = $('attSearch');
    if (i) { i.value = ''; i.focus(); }
    renderAttendList();
  };
  const inBtn = e.target.closest('[data-att-in]');
  if (inBtn) {
    const one = single();
    checkIn(inBtn.dataset.attIn, d);
    if (one) clearSearch();
    return;
  }
  const menu = e.target.closest('[data-att-menu]');
  if (menu) { openAttSheet(menu.dataset.attMenu, d, single() ? clearSearch : null); return; }
  const add = e.target.closest('[data-att-add]');
  if (add) openAddMemberModal({ checkInDate: d, name: add.dataset.attAdd });
}

function renderAttendFoot() {
  const live = attDate() === todayStr();
  setHtml($('attFoot'), `<button type="button" class="add-btn" id="attNewBtn">+ 新朋友：加入名册并${live ? '签到' : '补签'}</button>
    <button type="button" class="export-btn" id="attExportBtn">导出签到表 (CSV)</button>
    <div class="stat-note att-note">导出的表和纸质「繁星签到表」一样：一人一行，每次聚会一列，格子里是 ✓ / 迟 / ✗。周日过去以后，没签到的人自动算缺席。</div>`);
}
function onAttFootClick(e) {
  if (e.target.closest('#attNewBtn')) return openAddMemberModal({ checkInDate: attDate() });
  if (e.target.closest('#attExportBtn')) return openAttExport();
}

/* 点名字、点已签的状态、点「补签」：一个小表单，日期、几点到的、准时 / 迟到都能改。
   - 补签：默认就是正在看的那个周日、不填时间、准时，直接点「补签」就好；
   - 填了时间，按「几点以后算迟」自动选准时 / 迟到，也可以自己再点；
   - 改到别的周日：那天已经有他的签到的，会提示「用这次的替换」 */
const attSig = a => a ? `${a.id}|${a.status}|${a.arrived_at ? toDate(a.arrived_at).getTime() : ''}` : '';
function openAttSheet(memberId, date, afterSave = null) {
  const m = memberById(memberId);
  if (!m) return;
  const a = attOf(memberId, date);
  if (a && a._pending) { toast('正在保存，稍等一下再改'); return; }
  const t = todayStr();
  const has = !!a && a.status !== 'absent';            // 已经签过到（准时 / 迟到）
  const time0 = has ? (a.arrived_at ? fmtTime(toDate(a.arrived_at)) : '') : (date === t ? nowHM() : '');
  let status = has ? a.status : (time0 && time0 >= lateAfter() ? 'late' : 'present');
  const ref = showModal({
    title: `${m.name} · ${has ? '改签到' : date === t ? '签到' : '补签'}`,
    bodyHtml: `<div class="field-label">哪个周日</div>
      <select id="asDate">${attOptions(date, date)}</select>
      <div class="field-label">几点到的（不知道可以不填）</div>
      <div class="as-time"><input id="asTime" type="time" step="60" value="${time0}"><button type="button" class="link-btn" id="asNoTime">不填</button></div>
      <div class="field-label">准时还是迟到</div>
      <div class="as-seg" id="asSeg"><button type="button" class="as-st s-present" data-st="present">✓ 准时</button><button type="button" class="as-st s-late" data-st="late">迟到</button></div>
      <div class="stat-note" id="asNote"></div>
      ${has ? '<button type="button" class="link-danger" id="asClear">撤销这次签到</button>'
        : a ? '<button type="button" class="link-danger" id="asClear">删掉这条「缺席」记录</button>' : ''}`,
    buttons: [
      { label: '取消', variant: 'btn-ghost', onClick: c => c() },
      { label: '保存', variant: 'btn-primary', onClick: c => save(c) }
    ]
  });
  const card = ref.card, pick = s => card.querySelector(s);
  const dateEl = pick('#asDate'), timeEl = pick('#asTime'), noteEl = pick('#asNote'), okBtn = pick('.btn-primary');
  const hm = () => String(timeEl.value || '').slice(0, 5);
  // 改到的那天他已经有的签到（准时 / 迟到）；shown = 表单上次提示的是哪一条，保存时再核对一次
  const target = d => { const o = d !== date ? attOf(memberId, d) : null; return o && o.status !== 'absent' ? o : null; };
  let shown = '', timeTouched = false;
  const paint = () => {
    card.querySelectorAll('[data-st]').forEach(b => b.classList.toggle('active', b.dataset.st === status));
    const d = dateEl.value, tm = hm(), now = todayStr();
    const other = target(d), clash = !!other;
    shown = attSig(other);
    const notes = [];
    if (clash) notes.push(`${esc(fmtCn(d))} 已经有他的签到（${esc(attText(other))}），保存后换成这次填的`);
    if (tm && d === now && tm > nowHM()) notes.push('<span class="as-warn">时间不能晚于现在</span>');
    if (!has && ateOn(memberId, d)) notes.push('这天他用饭卡打过饭');
    if (has && a.created_by) notes.push(`${esc(a.created_by)} 签的${a.updated_by && a.updated_by !== a.created_by ? `，${esc(a.updated_by)} 改过` : ''}`);
    notes.push(`${esc(lateAfter())} 及以后到的算「迟」`);
    noteEl.innerHTML = notes.join('<br>');
    okBtn.textContent = clash ? '替换' : has ? '保存' : d === now ? '签到' : '补签';
  };
  const onTime = () => { timeTouched = true; const tm = hm(); if (/^\d\d:\d\d$/.test(tm)) status = tm >= lateAfter() ? 'late' : 'present'; paint(); };
  timeEl.addEventListener('input', onTime);
  timeEl.addEventListener('change', onTime);
  dateEl.addEventListener('change', () => {
    // 新签的、时间还没动过：换到今天就是现在的时间，换到过去的周日就不填（默认准时）
    if (!has && !timeTouched) {
      timeEl.value = dateEl.value === todayStr() ? nowHM() : '';
      status = hm() && hm() >= lateAfter() ? 'late' : 'present';
    }
    paint();
  });
  pick('#asNoTime').addEventListener('click', () => { timeTouched = true; timeEl.value = ''; paint(); });
  pick('#asSeg').addEventListener('click', e => { const b = e.target.closest('[data-st]'); if (b) { status = b.dataset.st; paint(); } });
  pick('#asClear')?.addEventListener('click', () => { ref.close(); clearAttendance(memberId, date, a); });
  paint();

  function save(close) {
    const d = dateEl.value, tm = hm(), now = todayStr();
    if (!d || d > now) { toast('不能给还没到的日子签到'); return; }
    if (tm && !/^([01]\d|2[0-3]):[0-5]\d$/.test(tm)) { toast('时间要写成 13:32 这样'); return; }
    if (tm && d === now && tm > nowHM()) { toast('签到时间不能晚于现在'); return; }
    // 表单开着的时候，另一台手机刚给他在要改到的那天签了到（或者删了）：先让他看清楚再决定替不替换
    if (attSig(target(d)) !== shown) { paint(); toast(target(d) ? `${m.name} ${fmtCn(d)} 刚被另一台手机签到了（${attText(target(d))}），请再看一下` : '那天的记录刚被另一台手机改了，请再看一下', 3600); return; }
    close();
    // 表单开着的时候另一台手机改了他这天的签到：不盖掉别人刚记的，请他再看一下
    const cur = attOf(memberId, date);
    if (attSig(cur) !== attSig(a)) { toast(`${m.name} 刚被另一台手机改成「${attText(cur)}」，这次没保存，请再看一下`, 3600); return; }
    if (has && d === date && tm === time0 && status === a.status) return;       // 什么都没改
    if (afterSave) afterSave();
    saveAttendance(memberId, { date: d, time: tm, status, from: has ? date : null, isNew: !has });
  }
}

function exportAttendanceCsv(from, to, label) {
  const t = todayStr();
  const dates = meetingDates(from, to);
  if (!dates.length) { toast('这段时间还没有签到记录', 3200); return; }
  // 名单：名册里的人 + 这段时间有记录、后来被隐藏的人
  const had = new Set(); for (const d of dates) for (const id of attOn(d).keys()) had.add(id);
  const people = [...activeMembers(), ...state.members.filter(m => m.active === false && had.has(m.id)).sort(compareMembers)];
  const head = ['小组', '姓名', ...dates.map(d => d.replace(/-/g, '/')), '到', '迟', '缺', '出勤率'];
  const perDate = dates.map(() => ({ present: 0, late: 0, absent: 0 }));
  const body = people.map(m => {
    let p = 0, l = 0, ab = 0, counted = 0;
    const cells = dates.map((d, i) => {
      const st = attStatusFor(m, d);
      if (!st) return '';
      counted++; perDate[i][st]++;
      if (st === 'present') p++; else if (st === 'late') l++; else ab++;
      return ATT[st].mark;
    });
    return [groupOf(m), m.name + (m.active === false ? '（已隐藏）' : ''), ...cells, p, l, ab, counted ? Math.round((p + l) / counted * 100) + '%' : ''];
  });
  const blanks = n => new Array(n).fill('');
  const foot = [
    ['', '准时（人）', ...perDate.map(x => x.present), ...blanks(4)],
    ['', '迟到（人）', ...perDate.map(x => x.late), ...blanks(4)],
    ['', '缺席（人）', ...perDate.map(x => x.absent), ...blanks(4)],
    // 那天是谁签的到（用哪个账号记的、改的）
    ['', '记录人', ...dates.map(d => [...new Set([...attOn(d).values()].flatMap(a => [a.created_by, a.updated_by]).filter(Boolean))].join('、')), ...blanks(4)],
  ];
  const title = [`繁星签到表（${label}）`, ...blanks(head.length - 1)];
  const csv = '﻿' + [title, head, ...body, blanks(head.length), ...foot].map(r => r.map(csvCell).join(',')).join('\r\n');
  saveCsv(`attendance_${t}.csv`, csv, `已导出 ${people.length} 人、${dates.length} 次聚会的签到`);
}

/* 名册里点开一个人：最近几次聚会的签到 + 这半年的次数 */
function attHistoryHtml(m) {
  const t = todayStr();
  const dates = meetingDates().reverse();
  const recent = [];
  for (const d of dates) { const st = attStatusFor(m, d); if (st) recent.push([d, st]); if (recent.length >= 8) break; }
  if (!recent.length) return '<div class="list-meta">还没有签到记录</div>';
  const h = halfOf(t);
  const c = { present: 0, late: 0, absent: 0 };
  for (const d of dates) if (d >= h.from && d <= h.to) { const st = attStatusFor(m, d); if (st) c[st]++; }
  return `<div class="att-hist">${recent.map(([d, st]) => `<span class="att-chip ${ATT[st].cls}">${esc(fmtShort(d))} ${ATT[st].mark}</span>`).join('')}</div>
    <div class="list-meta" style="margin-top:6px;">这半年：准时 ${c.present} 次 · 迟到 ${c.late} 次 · 缺席 ${c.absent} 次（周日没签到的算缺席）</div>`;
}

/* ---------- 批量导入名单 ---------- */
const NAME_HEADS = ['姓名', '名字', '名', 'name', '成员', '人员', '名单'];
const PINYIN_HEADS = ['拼音', '拼音首字母', 'pinyin'];
const HEADER_WORDS = [...NAME_HEADS, ...PINYIN_HEADS, '序号', '编号', 'no', 'no.', '#', '小组', '组别', '组', '饭卡', '电话', '备注'];
const CJK_NAME = /^[㐀-鿿]{2,4}$/;

/* 把粘贴的文字或表格内容解析成 [{name, pinyin}]。能认的格式：
   一行一个名字；从 Excel 复制的多列（Tab 分隔）；CSV（逗号分隔）；
   带表头的表格（按表头找「姓名」「拼音」那一列，表头上面的大标题不要）；
   第一列是序号；微信接龙那种「1. 张三」；一行里用中文逗号、顿号或空格隔开的几个名字。 */
function parseImportText(text) {
  const raws = String(text || '').split(/\r?\n/);
  const lines = raws.map(line =>
    line.split(line.includes('\t') ? /\t/ : /[,;，、；]/)
        .map(c => c.trim().replace(/^"(.*)"$/, '$1').replace(/""/g, '"').trim()));
  // 找表头：前几行里某一格正好是「姓名 / 名字 / …」
  let start = 0, nameCol = -1, pyCol = -1;
  const firstRows = [];
  for (let i = 0; i < lines.length && firstRows.length < 5; i++) if (lines[i].some(Boolean)) firstRows.push(i);
  const hi = firstRows.find(i => lines[i].some(c => NAME_HEADS.includes(c.toLowerCase())));
  if (hi !== undefined) {
    const low = lines[hi].map(c => c.toLowerCase());
    nameCol = low.findIndex(c => NAME_HEADS.includes(c));
    pyCol = low.findIndex(c => PINYIN_HEADS.includes(c));
    start = hi + 1;
  }
  const seen = new Set(), out = [];
  const add = (raw, py) => {
    const name = String(raw || '').replace(/^\d{1,3}\s*(?:[.．、)）:：-]\s*|\s+)/, '').trim();   // 「1. 张三」「2）李四」
    if (!name || HEADER_WORDS.includes(name.toLowerCase())) return;   // 空格子、漏网的表头
    if (/^\d+$/.test(name) || name.length > 20) return;                // 纯数字、太长的都不是名字
    if (seen.has(name)) return;                                        // 名单里自己重复
    seen.add(name);
    // 拼音列：只认像拼音首字母的（可能是「已付」之类的其他内容）
    const pinyin = /^[a-zA-Z]{1,12}$/.test(py || '') ? py.toLowerCase() : '';
    out.push({ name, pinyin });
  };
  for (let i = start; i < lines.length; i++) {
    const cells = lines[i];
    if (!cells.some(Boolean)) continue;
    if (nameCol >= 0) { add(cells[nameCol], pyCol >= 0 ? cells[pyCol] : ''); continue; }
    // 手打的「张三，李四、王五」：中文逗号 / 顿号隔开的是一串名字，不是表格的几列
    if (!raws[i].includes('\t') && /[，、；]/.test(raws[i])) { cells.forEach(c => add(c, '')); continue; }
    let parts = cells.filter(Boolean);
    if (/^\d+$/.test(parts[0]) && parts.length > 1) parts = parts.slice(1);   // 第一列是序号：跳过它
    const words = parts.length === 1 ? parts[0].split(/\s+/) : [];
    if (words.length > 1 && words.every(w => CJK_NAME.test(w))) { words.forEach(w => add(w, '')); continue; }
    add(parts[0], parts[1] || '');
  }
  return out;
}

/* 读 Excel / CSV，统一转成「每行用 Tab 分隔」的纯文本，再走同一个解析函数。
   空格子要留成空位，否则按表头找列会错位。 */
async function readSheetFile(file) {
  const buf = await file.arrayBuffer();
  if (/\.(csv|txt)$/i.test(file.name)) {
    // 中文 Windows 上 Excel「另存为 CSV」默认是 GBK 编码，直接按 UTF-8 读会变成乱码
    let text;
    try { text = new TextDecoder('utf-8', { fatal: true }).decode(buf); }
    catch { text = new TextDecoder('gb18030').decode(buf); }
    return text.replace(/^﻿/, '');
  }
  const XLSX = await import('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/+esm');
  const wb = XLSX.read(buf, { type: 'array' });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, blankrows: false, defval: '' });
  return rows
    .map(r => Array.from(r || [], c => (c == null ? '' : String(c).replace(/[\t\r\n]+/g, ' ').trim())).join('\t'))
    .filter(line => line.replace(/\t/g, '').trim())
    .join('\n');
}

/* 解析 + 查重 + 补拼音，预览和真正导入都用它（导入时现算，不依赖预览是否来得及刷新） */
async function prepareImport(text) {
  const rows = parseImportText(text);
  const byName = new Map();
  for (const m of state.members) { const a = byName.get(m.name) || []; a.push(m); byName.set(m.name, a); }
  for (const r of rows) {
    const same = byName.get(r.name) || [];
    const vis = same.find(m => m.active !== false), hid = same.find(m => m.active === false);
    r.kind = vis ? 'dup' : hid ? 'restore' : 'new';
    if (hid && !vis) r.memberId = hid.id;
  }
  let auto = false;
  for (const r of rows.filter(x => x.kind === 'new' && !x.pinyin)) { r.pinyin = await pinyinOf(r.name); auto = auto || !!r.pinyin; }
  return { rows, auto };
}

        一个小组导一次最方便：先点上面的组号，再把这组人的名字粘进来。<br>
        在 Excel 里选中姓名那一列 → 复制 → 粘贴到下面，一行一个人。<br>
        想同时带上拼音就复制两列（姓名、拼音）；不带也行，会自动生成。
      </div>
      <textarea id="impText" rows="6" placeholder="张三&#10;李四&#10;王五"></textarea>
      <div class="imp-or">或者直接选文件</div>
      <input id="impFile" type="file" accept=".xlsx,.xls,.csv,.txt">
      <div class="imp-preview" id="impPreview"></div>`,
    buttons: [
      { label: '取消', variant: 'btn-ghost', onClick: close => close() },
      { label: '导入', variant: 'btn-primary', onClick: async close => {
          if (busy) return;
          const text = $('impText')?.value || '';
          const grp = readGroupPicker(modalRef.card);   // 必须在 close() 之前读
          busy = true;
          const { rows } = await prepareImport(text);
          busy = false;
          const todo = rows.filter(r => r.kind !== 'dup');
          if (!rows.length) { toast('还没有可导入的名单'); return; }
          if (!todo.length) { toast('这些人都已经在名册里了'); return; }
          close();
          await bulkAddMembers(todo, grp);
        } }
    ]
  });

  bindGroupPicker(modalRef.card);
  const preview = $('impPreview');
  let seq = 0;

  async function refresh(text) {
    const my = ++seq;
    if (!parseImportText(text).length) { preview.innerHTML = ''; return; }
    preview.innerHTML = `<div style="color:var(--ink-soft);">正在整理名单…</div>`;
    const { rows, auto } = await prepareImport(text);
    if (my !== seq || !document.body.contains(preview)) return;     // 已经有更新的输入了
    const add = rows.filter(r => r.kind === 'new'), back = rows.filter(r => r.kind === 'restore'), dup = rows.filter(r => r.kind === 'dup');
    preview.innerHTML =
      `<div><strong>将添加 ${add.length} 人</strong>${back.length ? `，恢复 ${back.length} 个之前隐藏的` : ''}${dup.length ? `，跳过 ${dup.length} 个已存在的` : ''}${auto ? '，拼音已自动生成' : ''}</div>
       <div class="imp-names">${rows.map(r =>
         `<span class="imp-chip${r.kind === 'dup' ? ' dup' : ''}">${esc(r.name)}${r.kind === 'restore' ? ' <span style="opacity:.6">恢复</span>' : r.pinyin && r.kind === 'new' ? ` <span style="opacity:.6">${esc(r.pinyin)}</span>` : ''}</span>`
       ).join('')}</div>`;
  }

  let t = null;
  $('impText').addEventListener('input', e => {
    const v = e.target.value;
    if (t) clearTimeout(t);
    t = setTimeout(() => refresh(v), 250);
  });

  $('impFile').addEventListener('change', async e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    preview.innerHTML = `<div style="color:var(--ink-soft);">正在读取 ${esc(file.name)}…</div>`;
    try {
      const text = await readSheetFile(file);
      const box = $('impText');
      if (box) box.value = text;
      await refresh(text);
    } catch (err) {
      console.error(err);
      preview.innerHTML = `<div style="color:var(--brick);">这个文件读不了。请在 Excel 里另存为 CSV 再试，或者直接把姓名那一列复制粘贴到上面的框里。</div>`;
    }
  });
}

async function bulkAddMembers(rows, groupName) {
  const fresh = rows.filter(r => r.kind === 'new').map(r => ({ id: uuid(), name: r.name, pinyin: r.pinyin || '', group_name: groupName || '' }));
  const back = rows.filter(r => r.kind === 'restore');
  state.pendingOps++; writeSeq++;
  try {
    if (fresh.length) {
      const saved = await withRetry(async () => must(await sb.from('members').upsert(fresh, { onConflict: 'id', ignoreDuplicates: true }).select()));
      for (const r of saved || []) upsertRow('members', r);
      if ((saved || []).length < fresh.length) fullReload();   // 重发时有些已经存在：以数据库为准再核对一遍
    }
    for (const r of back) {
      upsertRow('members', await updateRow('members', r.memberId, { active: true, ...(groupName ? { group_name: groupName } : {}) }));
    }
    if (groupName) state.group = groupName;   // 导完直接跳到这个小组，方便核对
    render();
    toast(`已导入 ${fresh.length} 位${back.length ? `，恢复 ${back.length} 位` : ''}${groupName ? '到「' + groupName + '」' : ''}`, 3200);
  } catch (e) {
    toast(friendly(e, '导入失败'), 4200);
    fullReload();
  } finally { state.pendingOps--; }
}

/* ---------- 钱的显示与「收支算账」的时间段 ---------- */
function eur(n) {
  const v = Math.round((Number(n) || 0) * 100) / 100;
  const abs = Math.abs(v), txt = Number.isInteger(abs) ? String(abs) : abs.toFixed(2);
  return (v < 0 ? '−€' : '€') + txt;
}
const PERIODS = [['month', '本月'], ['lastMonth', '上月'], ['year', '今年'], ['all', '全部']];
function periodRange(p) {
  const [y, m] = todayStr().split('-').map(Number);
  const pad = n => String(n).padStart(2, '0');
  if (p === 'month') return { from: `${y}-${pad(m)}-01`, to: `${y}-${pad(m)}-31` };
  if (p === 'lastMonth') { const ly = m === 1 ? y - 1 : y, lm = m === 1 ? 12 : m - 1; return { from: `${ly}-${pad(lm)}-01`, to: `${ly}-${pad(lm)}-31` }; }
  if (p === 'year') return { from: `${y}-01-01`, to: `${y}-12-31` };
  return { from: '0000-01-01', to: '9999-12-31' };
}
const inRange = (d, r) => !!d && d >= r.from && d <= r.to;
/* 某段时间的收支：卡费按实际收钱那天算，散客按记录那天，支出按支出那天 */
function ledger(r) {
  const paidCards = state.cards.filter(c => c.is_paid && c.paid_at && inRange(fmtDate(toDate(c.paid_at)), r)).length;
  const cash = state.cashLogs.filter(l => inRange(l.log_date, r));
  const cashSum = cash.reduce((s, l) => s + (Number(l.amount) || 0), 0);
  const exps = state.expenses.filter(x => inRange(x.spent_date, r))
    .sort((a, b) => (a.spent_date < b.spent_date ? 1 : a.spent_date > b.spent_date ? -1 : toDate(b.created_at) - toDate(a.created_at)));
  const expSum = exps.reduce((s, x) => s + (Number(x.amount) || 0), 0);
  const income = paidCards * 20 + cashSum;
  return { paidCards, cashCount: cash.length, cashSum, income, exps, expSum, balance: income - expSum };
}

function renderFinance() {
  const today = todayStr();
  // 看板看「最近一次聚会」：今天是周日、或者今天有收支，就看今天；不然看上一个周日（周一打开不会是一排 0）
  const paidOn = c => c.is_paid && c.paid_at ? fmtDate(toDate(c.paid_at)) : '';
  const busy = d => state.usages.some(u => u.used_date === d) || state.cashLogs.some(l => l.log_date === d)
    || state.expenses.some(x => x.spent_date === d) || state.cards.some(c => paidOn(c) === d);
  const day = weekdayOf(today) === 0 || busy(today) ? today : latestSunday(today);
  const isToday = day === today, D = isToday ? '今日' : '当天';

  const todayPunches = state.usages.filter(u => u.used_date === day).length;
  const todayCash = state.cashLogs.filter(l => l.log_date === day);
  // 这天实际收到的卡费：按「收款时间」算——上周开卡、今天补交的 20 欧也算今天的
  const todayPaidCards = state.cards.filter(c => paidOn(c) === day).length;
  const revenue = todayCash.length * 4 + todayPaidCards * 20;
  const todayExp = state.expenses.filter(x => x.spent_date === day).reduce((s, x) => s + (Number(x.amount) || 0), 0);

  const counts = {};
  state.usages.forEach(u => { counts[u.used_date] = (counts[u.used_date] || 0) + 1; });
  state.cashLogs.forEach(l => { counts[l.log_date] = (counts[l.log_date] || 0) + 1; });
  const dates = Object.keys(counts).sort().slice(-8);
  const max = Math.max(1, ...dates.map(d => counts[d]));

  const bars = dates.map(d =>
    `<div class="bar-wrap"><div class="bar-count">${counts[d]}</div><div class="bar" style="height:${Math.max(4, Math.round(counts[d] / max * 100))}%"></div><div class="bar-label">${esc(fmtShort(d))}</div></div>`
  ).join('');

  const cashRows = todayCash.length === 0
    ? `<div style="color:var(--ink-soft);font-size:13px;padding:8px 2px;">${isToday ? '今天还没有散客记录' : '当天没有散客记录'}</div>`
    : todayCash
        .slice()
        .sort((a, b) => toDate(a.created_at) - toDate(b.created_at))
        .map(l => `<div class="list-row">
            <span>散客 4欧 <span class="list-meta">${esc(fmtTime(toDate(l.created_at)))}${recBy(l) ? ' · ' + esc(recBy(l)) : ''}</span></span>
            <button class="icon-btn" data-del-cash="${esc(l.id)}" aria-label="删除这笔">×</button>
          </div>`).join('');

  const owing = state.cards.filter(c => !c.is_paid && c.status !== 'ARCHIVED');
  const owingRows = owing.length === 0
    ? `<div style="color:var(--ink-soft);font-size:13px;padding:8px 2px;">没有待收款的饭卡</div>`
    : owing.map(c => `<div class="list-row">
        <span>${esc(memberById(c.member_id)?.name || '(已删除)')} <span class="list-meta">${esc(fmtDate(toDate(c.created_at)))} 开卡 · 欠 20欧</span></span>
        <button class="mini-btn" data-mark-paid="${esc(c.id)}">标记已收</button>
      </div>`).join('');

  // 收支算账：选一段时间，看收入、支出、结余
  const L = ledger(periodRange(state.finPeriod));
  const periodChips = PERIODS.map(([k, label]) =>
    `<button class="group-chip${state.finPeriod === k ? ' active' : ''}" data-period="${k}">${label}</button>`).join('');
  const expRows = L.exps.length === 0
    ? `<div style="color:var(--ink-soft);font-size:13px;padding:8px 2px;">这段时间还没有支出</div>`
    : L.exps.map(x => `<div class="list-row">
        <span>${esc(fmtShort(x.spent_date))} ${esc(x.purpose || '（没写用途）')}${x.handler ? ` <span class="list-meta">· ${esc(x.handler)}</span>` : ''}${recBy(x) ? ` <span class="list-meta">· ${esc(recBy(x))} 记</span>` : ''}</span>
        <span class="row-btns"><span class="exp-amt">${esc(eur(-(Number(x.amount) || 0)))}</span><button class="icon-btn" data-del-exp="${esc(x.id)}" aria-label="删除这笔支出">×</button></span>
      </div>`).join('');

  $('main').dataset.view = 'finance';
  $('main').innerHTML = `
    <div class="section-title">${isToday ? '今日看板' : `${esc(fmtCn(day))} 看板`}</div>
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-value">${todayPunches + todayCash.length}</div><div class="stat-label">${D}就餐人次</div></div>
      <div class="stat-card"><div class="stat-value">${todayCash.length}</div><div class="stat-label">其中现金 4欧</div></div>
      <div class="stat-card"><div class="stat-value">€${revenue}</div><div class="stat-label">${D}应收</div></div>
    </div>
    <div class="stat-note">${D}应收 = 散客 4€ × ${todayCash.length} ＋ ${isToday ? '今天' : '当天'}收到的卡费 20€ × ${todayPaidCards}（含补交）${todayExp ? `<br>${isToday ? '今天' : '当天'}另有支出 ${esc(eur(todayExp))}，见下方「收支算账」` : ''}</div>

    <div class="section-title">${D}散客流水</div>
    ${cashRows}

    <div class="section-title">待收款饭卡（${owing.length}）</div>
    ${owingRows}

    <div class="section-title">收支算账</div>
    <div class="group-bar period-bar">${periodChips}</div>
    <div class="ledger">
      <div class="ledger-row"><span>收入</span><strong>${esc(eur(L.income))}</strong></div>
      <div class="ledger-sub">卡费 20€ × ${L.paidCards} = ${esc(eur(L.paidCards * 20))}　·　散客 ${L.cashCount} 笔 = ${esc(eur(L.cashSum))}</div>
      <div class="ledger-row"><span>支出</span><strong>${esc(eur(-L.expSum))}</strong></div>
      <div class="ledger-row total"><span>结余</span><strong class="${L.balance < 0 ? 'neg' : ''}">${esc(eur(L.balance))}</strong></div>
    </div>
    <button class="add-btn" id="addExpenseBtn" style="margin-top:10px;">+ 记一笔支出</button>
    ${expRows}

    ${dates.length ? `<div class="section-title">近期就餐人数</div><div class="chart"><div class="bars">${bars}</div></div>` : ''}

    <button class="export-btn" id="exportBtn">导出全部明细 (CSV)</button>
    <div style="text-align:center;color:var(--ink-soft);font-size:12px;margin-top:8px;line-height:1.6;">
      用 Excel 打开就是「繁星打饭系统收入支出记录」表：一笔一行；<br>支出记为负数（姓名写经手人），Amount 一列加起来就是结余；<br>最后一列 Recorded_By 是谁记的
    </div>

    <div class="section-title">登录账号</div>
    <div class="list-row">
      <span>${isShared() ? '共用账号 <span class="list-meta">大家用同一个密码登录，记成 admin</span>' : `${esc(myName() || myUser())} <span class="list-meta">${esc(state.user?.email || '')}</span>`}</span>
      <span class="row-btns">${isShared() ? '' : '<button class="mini-btn" id="myNameBtn">改名字</button>'}<button class="mini-btn" id="changePwBtn">修改密码</button></span>
    </div>
    ${canSuggestInstall() ? `<div class="section-title">手机上用</div>
    <div class="list-row">
      <span>放到手机主屏幕 <span class="list-meta">像 App 一样全屏打开</span></span>
      <button class="mini-btn" id="installHelpBtn">怎么加</button>
    </div>` : ''}`;

  document.querySelectorAll('[data-del-cash]').forEach(b =>
    b.addEventListener('click', () => {
      const l = state.cashLogs.find(x => x.id === b.dataset.delCash);
      if (!l) return;
      showModal({
        title: '删除这笔散客记录？',
        bodyHtml: `${isToday ? '' : esc(fmtCn(l.log_date)) + ' '}${esc(fmtTime(toDate(l.created_at)))} 记的这笔 4 欧。删除后${D}应收会减少 4 欧。`,
        buttons: [
          { label: '不删', variant: 'btn-ghost', onClick: close => close() },
          { label: '删除', variant: 'btn-danger', onClick: close => { close(); deleteCashLog(l.id); } }
        ]
      });
    }));
  document.querySelectorAll('[data-mark-paid]').forEach(b =>
    b.addEventListener('click', () => setPaid(b.dataset.markPaid, true)));
  document.querySelectorAll('[data-period]').forEach(b =>
    b.addEventListener('click', () => { state.finPeriod = b.dataset.period; render(); }));
  document.querySelectorAll('[data-del-exp]').forEach(b =>
    b.addEventListener('click', () => askDeleteExpense(b.dataset.delExp)));
  $('addExpenseBtn').addEventListener('click', openExpenseModal);
  $('exportBtn').addEventListener('click', exportCsv);
  $('changePwBtn').addEventListener('click', openChangePasswordModal);
  if ($('myNameBtn')) $('myNameBtn').addEventListener('click', () => askMyName(true));
  if ($('installHelpBtn')) $('installHelpBtn').addEventListener('click', openInstallHelp);
}

const HANDLER_KEY = 'mealcard.handler';
function lastHandler() { try { return localStorage.getItem(HANDLER_KEY) || ''; } catch { return ''; } }
function openExpenseModal() {
  const modalRef = showModal({
    title: '记一笔支出',
    bodyHtml: `<div class="field-label">金额（欧）</div>
      <input id="exAmount" type="text" inputmode="decimal" placeholder="例如：35.50" autocomplete="off">
      <div class="field-label">用途</div>
      <input id="exPurpose" type="text" maxlength="200" placeholder="例如：买米、饮料、一次性餐具" autocomplete="off">
      <div class="field-label">日期</div>
      <input id="exDate" type="date" value="${esc(todayStr())}">
      <div class="field-label">经手人（谁付的钱，选填）</div>
      <input id="exHandler" type="text" maxlength="50" value="${esc(lastHandler())}" placeholder="例如：小明垫付" autocomplete="off">`,
    buttons: [
      { label: '取消', variant: 'btn-ghost', onClick: close => close() },
      { label: '保存', variant: 'btn-primary', onClick: close => {
          const raw = String($('exAmount').value || '').trim().replace(/^€\s*/, '').replace(/\s*€$/, '').replace(',', '.');
          const amount = Math.round(Number(raw) * 100) / 100;
          const purpose = $('exPurpose').value.trim();
          const date = $('exDate').value;
          const handler = $('exHandler').value.trim();
          if (!raw || !Number.isFinite(amount) || amount <= 0) { toast('请填写金额（比如 35.50）'); return; }
          if (amount >= 100000) { toast('金额太大了，请检查一下'); return; }
          if (!purpose) { toast('请写一下用途，方便以后算账'); return; }
          if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { toast('请选择日期'); return; }
          close();
          addExpense({ amount, purpose, date, handler });
        } }
    ]
  });
  setTimeout(() => $('exAmount')?.focus(), 60);
  return modalRef;
}

async function addExpense({ amount, purpose, date, handler }) {
  try { localStorage.setItem(HANDLER_KEY, handler); } catch {}
  const row = { id: uuid(), spent_date: date, amount, purpose, handler, operator: state.user?.email || null, created_at: new Date().toISOString(), _pending: true };
  // 记的日期不在当前看的时间段里：切到「全部」，不然刚记的这笔看不到
  if (!inRange(date, periodRange(state.finPeriod))) state.finPeriod = 'all';
  const ok = await optimistic(
    () => upsertRow('expenses', row),
    () => removeRow('expenses', row.id),
    async () => upsertRow('expenses', await insertRow('expenses', { id: row.id, spent_date: date, amount, purpose, handler, operator: row.operator }))
  );
  if (ok) toast(`已记一笔支出 ${eur(amount)}（${fmtShort(date)} ${purpose}）`);
}

function askDeleteExpense(id) {
  const x = state.expenses.find(e => e.id === id);
  if (!x) return;
  showModal({
    title: '删除这笔支出？',
    bodyHtml: `${esc(x.spent_date)} ${esc(x.purpose || '')}${x.handler ? '（' + esc(x.handler) + '）' : ''}，<strong>${esc(eur(Number(x.amount) || 0))}</strong>。删除后结余会跟着变。`,
    buttons: [
      { label: '不删', variant: 'btn-ghost', onClick: close => close() },
      { label: '删除', variant: 'btn-danger', onClick: close => { close(); deleteExpense(id); } }
    ]
  });
}
async function deleteExpense(id) {
  const backup = state.expenses.find(e => e.id === id);
  if (!backup) return;
  const ok = await optimistic(
    () => removeRow('expenses', id),
    () => upsertRow('expenses', backup),
    () => deleteRow('expenses', id)
  );
  if (ok) toast('已删除这笔支出');
}

    buttons: [
      { label: '取消', variant: 'btn-ghost', onClick: close => close() },
      { label: '修改', variant: 'btn-primary', onClick: close => {
          const oldPw = $('pwOld').value, pw1 = $('pwNew').value, pw2 = $('pwNew2').value;
          if (!oldPw) { toast('请输入现在的密码'); return; }
          if (pw1.length < 8) { toast('新密码至少要 8 位'); return; }
          if (pw1 !== pw2) { toast('两次输入的新密码不一样'); return; }
          if (pw1 === oldPw) { toast('新密码和现在的一样'); return; }
          close();
          changePassword(oldPw, pw1);
        } }
    ]
  });
  setTimeout(() => $('pwOld')?.focus(), 60);
}
async function changePassword(oldPw, newPw) {
  const email = state.user?.email;
  try {
    // 先确认现在的密码：别人拿着没锁屏的手机也不能随手把密码改掉
    const chk = await sb.auth.signInWithPassword({ email, password: oldPw });
    if (chk.error) throw chk.error;
    const up = await sb.auth.updateUser({ password: newPw });
    if (up.error) throw up.error;
    await sb.auth.signOut({ scope: 'others' });           // 其他设备的登录全部作废
    toast('密码已改好。其他手机要用新密码重新登录', 4200);
  } catch (e) {
    const code = e?.code || '', m = String(e?.message || '');
    if (code === 'invalid_credentials' || /Invalid login/i.test(m)) toast('现在的密码不对，密码没有改', 4200);
    else if (code === 'weak_password' || /weak|at least/i.test(m)) toast('新密码太简单了，请换一个更长的', 4200);
    else if (code === 'same_password' || /different from the old/i.test(m)) toast('新密码和现在的一样', 4200);
    else if (code === 'reauthentication_needed' || /reauthenticat/i.test(m)) toast('Supabase 要求重新验证：请先退出、重新登录，然后马上修改', 5000);
    else if (code === 'over_request_rate_limit' || e?.status === 429) toast('尝试次数太多了，请过几分钟再试', 4200);
    else toast(friendly(e, '修改密码失败'), 4200);
  }
}

function platformInfo() {
  const ua = navigator.userAgent || '';

  const ios = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  return { standalone, ios, android: /Android/i.test(ua), wechat: /MicroMessenger/i.test(ua) };
}
function isIOSHomeScreenApp() { const p = platformInfo(); return p.standalone && p.ios; }

/* CSV 单元格：防止名字以 = + - @ 开头时被 Excel 当成公式执行 */
function csvCell(v) {
  let s = String(v ?? '');
  // 单独一个「-」（散客、支出那一列的占位）不是公式，不用加引号
  if (/^[=+\-@\t\r]/.test(s) && !/^-?\d+(\.\d+)?$/.test(s) && s !== '-') s = "'" + s;
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
/* 导出格式照团契自己设计的模板：第 1 行标题，第 2 行表头，下面一笔一行，日期写成 2026/09/30。
   支出那一行：姓名一栏写经手人（没填就写 -），备注写用途，金额记负数 —— Amount 整列加起来就是结余 */
const CSV_TITLE = '繁星打饭系统收入支出记录';
const CSV_HEAD = ['Date', 'Member_Name', 'Group', 'Type', 'Amount', 'Note', 'Recorded_By'];
/* 谁记的：第 8 版以后由数据库写；以前的散客、支出只有登录邮箱，取 @ 前面那段 */
const recBy = r => r.created_by || (r.operator ? String(r.operator).split('@')[0] : '');
function exportCsv() {
  const rows = [];
  for (const c of state.cards) {
    const m = memberById(c.member_id);
    // 购卡记在「实际收钱」那天：上周开卡、今天补交的，算今天
    if (c.is_paid) rows.push([fmtDate(toDate(c.paid_at || c.created_at)), m?.name || '(已删除成员)', groupOf(m), '购卡', 20, '', c.paid_by || c.created_by || '']);
  }
  for (const u of state.usages) {
    if (u._pending) continue;
    const m = memberById(u.member_id);
    rows.push([u.used_date, m?.name || '(已删除成员)', groupOf(m), '用卡', 0, '', u.created_by || '']);
  }
  for (const l of state.cashLogs) {
    if (l._pending) continue;
    rows.push([l.log_date, '-', '', '现金', Number(l.amount) || 4, '', recBy(l)]);
  }
  for (const x of state.expenses) {
    if (x._pending) continue;
    rows.push([x.spent_date, String(x.handler || '').trim() || '-', '', '支出', -(Math.round((Number(x.amount) || 0) * 100) / 100), x.purpose || '', recBy(x)]);
  }
  // 先按日期排好（同一天里：购卡 → 用卡 → 现金 → 支出），再把 2026-09-30 写成 2026/09/30
  const body = rows.sort((a, b) => (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0))
    .map(r => [String(r[0] || '').replace(/-/g, '/'), ...r.slice(1)]);
  const title = [CSV_TITLE, ...CSV_HEAD.slice(1).map(() => '')];
  const csv = '﻿' + [title, CSV_HEAD, ...body].map(r => r.map(csvCell).join(',')).join('\r\n');

  saveCsv(`mealcard_${todayStr()}.csv`, csv, '已导出 ' + body.length + ' 条记录');
}

/* 把 CSV 交给用户：一般是下载；iPhone 上「加到主屏幕」的 App 里改走系统「分享」面板——
   普通下载在那里会打开一个没有返回键的预览页，只能强退 App。分享面板可以存到「文件」、发微信、AirDrop、发邮件。
   要在点按钮的同一刻调用（中间不能等网络），iPhone 才肯弹出分享面板。 */
function saveCsv(name, csv, doneMsg) {
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  if (isIOSHomeScreenApp()) {
    const file = new File([blob], name, { type: 'text/csv' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: name }).then(
        () => toast(doneMsg),
        err => { if (err && err.name === 'AbortError') return; toast('没能打开分享面板，请再点一次「导出」', 3600); });
      return;
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  // 文件名用英文：部分浏览器会丢掉中文文件名，导出成没有扩展名的 "download"
  a.download = name;
  document.body.appendChild(a);
  a.click();
  // 不要马上移除：部分浏览器会因此丢掉文件名
  setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 3000);
  toast(doneMsg);
}

async function startApp() {
  $('app').dataset.shell = '';
  $('app').innerHTML = `<div class="loading-screen"><div class="spinner"></div><div>正在加载数据…</div></div>`;
  try {
    // 先确认数据库已经升级到这一版需要的规则（版本不对就停下来说明，而不是半对半错地运行）
    const ver = await sb.rpc('mealcard_schema_version');
    if (ver.error) {
      if (ver.status === 0 || isNetErr(ver.error)) throw Object.assign(new Error(ver.error.message), { status: 0 });
      // 只有「找不到这个函数」才说明数据库还没升级；别的错误（密钥不对、项目暂停等）照实报
      if (ver.status === 404 || ver.error.code === 'PGRST202' || /Could not find the function/i.test(ver.error.message || '')) return renderUpgradeNeeded();
      throw Object.assign(new Error(ver.error.message || '未知错误'), { code: ver.error.code, status: ver.status });
    }
    if ((ver.data ?? 0) < 8) return renderUpgradeNeeded();
    setSnapshot(await loadAll());
    lastFullLoad = Date.now();
  } catch (e) {
    console.error(e);
    renderGateWithActions('读取数据失败', [
      esc(isNetErr(e) ? '网络不通，或者 Supabase 项目暂时连不上。'
        : e?.status >= 500 ? `Supabase 服务器暂时出错（${e.status}），一般过一会儿就好。`
        : (e?.message || '未知错误')),
      '网络恢复后点「重试」就行。如果一直不行，看看 Supabase 项目是不是因为太久没用被暂停了（后台点一下 Restore 即可）。'
    ]);
    return;
  }
  render();
  subscribeRealtime();
  checkSignupDisabled();
  askMyName();                       // 小组长第一次用自己的账号：问名字（「记录」里显示）
}

async function checkSignupDisabled() {
  if (signupChecked) return;
  signupChecked = true;
  try {
    const r = await fetchWithTimeout(`${SB_URL}/auth/v1/settings`, { headers: { apikey: SB_KEY } });
    if (!r.ok) return;
    const s = await r.json();
    if (s && s.disable_signup === false && state.user) {
      showModal({
        title: '⚠️ 安全提醒：还允许任何人注册',
        bodyHtml: `你的 Supabase 项目还开着「允许新用户注册」。在这个系统里，登录的人都能看、能改全部记录，所以<strong>陌生人自己注册一个账号就能进来</strong>。<br><br>请到 Supabase 后台 → <strong>Authentication</strong> → <strong>Sign In / Providers</strong>，把 <strong>Allow new users to sign up</strong> 关掉 → <strong>Save</strong>。关掉以后这个提醒就不会再出现。`,
        buttons: [{ label: '知道了', variant: 'btn-primary', onClick: close => close() }]

/* Supabase 后台上有好几个看起来都像网址的东西，很容易复制到带路径的那种。
   这里把常见的几种写法都自动修正成正确的项目地址。 */
function cleanSupabaseUrl(raw) {
  let s = String(raw || '').trim().replace(/^["']|["']$/g, '');
  if (!s) return '';
  if (!/^https?:\/\//i.test(s)) s = 'https://' + s;
  try {
    const u = new URL(s);
    return u.protocol + '//' + u.host;   // 丢掉 /rest/v1、结尾斜杠、查询参数等
  } catch {
    return s.replace(/\/+$/, '');
  }
}

/* 每个请求最多等 15 秒：信号差时不会一直卡住，而是报错、回滚、提示 */
function fetchWithTimeout(input, init = {}) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 15000);
  if (init.signal) init.signal.addEventListener('abort', () => ctl.abort(), { once: true });
  return fetch(input, { ...init, signal: ctl.signal }).finally(() => clearTimeout(timer));
}

(async function boot() {
  const cfg = window.MEALCARD_CONFIG || {};
  const url = cleanSupabaseUrl(cfg.SUPABASE_URL);
  const key = String(cfg.SUPABASE_ANON_KEY || '').trim();
  if (!url || !key) { renderSetupNeeded(); return; }
  window.__MEALCARD_RESOLVED_URL = url;   // 排查问题时可在控制台查看
  SB_URL = url; SB_KEY = key;
  SHARED_ACCOUNT = String(cfg.SHARED_ACCOUNT || SHARED_ACCOUNT_DEFAULT).trim().toLowerCase();

  // 别的网站把这个页面套在自己页面里（iframe）诱导点击：直接不显示
  if (window.top !== window.self) {
    $('app').innerHTML = `<div class="gate"><h1>请直接打开网址</h1><p>为了安全，这个页面不能被嵌在别的网页里使用。</p></div>`;
    return;
  }

  sb = createClient(url, key, {
    auth: { persistSession: true, autoRefreshToken: true },
    global: { fetch: fetchWithTimeout }
  });

  /* 登录失效了（比如在 Supabase 后台被强制退出、登录凭证作废）：
     这时数据库什么都不会给，再刷新就会显示一张「空名单」，看起来像数据全丢了。
     所以一旦发现被退出，马上回到登录页，并说清楚数据还在。 */
  sb.auth.onAuthStateChange(event => {
    if (event !== 'SIGNED_OUT' || !state.user) return;
    state.user = null;
    if (channel) { try { sb.removeChannel(channel); } catch {} channel = null; }
    state.realtimeOk = false;
    modalStack.slice().forEach(m => m.close());
    renderLogin();
    const err = $('loginErr');
    if (err) err.textContent = '登录已失效，请重新登录（数据都还在，不会丢）';
  });

  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    state.user = session.user;
    await startApp();
  } else {
    renderLogin();
  }
})();
</script>
