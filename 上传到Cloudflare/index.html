<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF6EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1E1B16" media="(prefers-color-scheme: dark)">
<title>繁星团契管理系统</title>
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="繁星团契管理系统">
<meta name="application-name" content="繁星团契管理系统">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FBF6EC;
    --paper-line: #E4DAC5;
    --surface: #FFFFFF;
    --ink: #2B2621;
    --ink-soft: #6B6255;
    --pine: #33513F;
    --pine-dark: #22392C;
    --pine-soft: #DCE8DF;
    --amber: #A9701C;
    --amber-soft: #F3E2C4;
    --brick: #9C4430;
    --brick-soft: #F4E2DC;
    --font-display: 'Zilla Slab', Georgia, 'Songti SC', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1E1B16; --paper-line: #3A342B; --surface: #26221C;
      --ink: #EDE6D8; --ink-soft: #A79C89;
      --pine: #7FB79A; --pine-dark: #5B9279; --pine-soft: #223B31;
      --amber: #E0A54B; --amber-soft: #3B2E1A; --brick: #E0937C; --brick-soft: #3A231D;
    }
  }
  * { box-sizing: border-box; }
  html { height: 100%; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  /* iPhone：连点两下不会突然把页面放大（双指缩放照样能用） */
  html { touch-action: manipulation; }
  body {
    height: 100%; margin: 0;
    background: var(--paper); color: var(--ink);
    font-family: var(--font-body);
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
  }
  h1, h2, h3 { font-family: var(--font-display); margin: 0; }
  button, input, select { font-family: inherit; }
  #app { min-height: 100%; display: flex; flex-direction: column; }

  /* ---------- header ---------- */
  .app-header {
    position: sticky; top: 0; z-index: 20;
    background: var(--paper); border-bottom: 1px solid var(--paper-line);
    padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 10px;
  }
  .header-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .header-brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .header-title { font-size: 20px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  @media (max-width: 359px) { .ht-tail { display: none; } }      /* 窄屏只写「繁星团契」，给右边的按钮留地方 */
  .header-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }   /* 「记录」「退出」隔开一点，免得点错 */
  .hist-btn {
    background: none; border: none; color: var(--pine); font-size: 12.5px; font-weight: 600; cursor: pointer;
    padding: 6px 8px; display: inline-flex; align-items: center; gap: 3px; font-family: inherit;
  }
  .hist-btn svg { width: 15px; height: 15px; }

  /* SYM 标志。图本身是白底，做成圆角方块后在深色模式下也像个 App 图标 */

    background-size: contain; background-repeat: no-repeat; background-position: center;
    background-color: #fff; border-radius: 22%; flex: 0 0 auto; display: block;
  }
  .header-logo { width: 27px; height: 27px; }
  .gate-logo { width: 78px; height: 78px; margin-bottom: 20px; }
  .header-sub {
    display: block; margin-top: 2px; font-size: 12.5px; color: var(--ink-soft);
    background: none; border: none; padding: 2px 0; font-family: inherit; text-align: left; cursor: pointer;
  }
  .refresh-ico { opacity: .55; margin-left: 2px; }
  .signout { background: none; border: none; color: var(--ink-soft); font-size: 12.5px; cursor: pointer; padding: 6px 8px; margin-right: -8px; }
  .sync-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--pine); margin-right: 5px; vertical-align: middle; }
  .sync-dot.off { background: var(--amber); }

  main { flex: 1; padding: 12px 16px calc(92px + env(safe-area-inset-bottom, 0px)); max-width: 640px; width: 100%; margin: 0 auto; }
  main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  /* 打饭台右下角有悬浮的「+4欧单次」，它占到距底约 123px。
     留白不够的话，列表最后一个人的按钮会被它盖住点不到。 */
  main[data-tab="serve"] { padding-bottom: calc(148px + env(safe-area-inset-bottom, 0px)); }

  /* ---------- tabbar ---------- */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    display: flex; background: var(--surface); border-top: 1px solid var(--paper-line);
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
  }
  .tab-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
    background: none; border: none; color: var(--ink-soft);
    padding: 6px 4px; border-radius: 10px; font-size: 11.5px; cursor: pointer;
  }
  .tab-btn svg { width: 22px; height: 22px; }
  .tab-btn.active { color: var(--pine); }

  /* ---------- serve tab ---------- */
  /* 顶栏也是 sticky top:0，所以搜索框必须停在顶栏下沿，
     否则滚动时会钻到顶栏底下被盖住。--header-h 由脚本按实际高度写入。 */
  .search-bar {
    position: sticky; top: var(--header-h, 56px); z-index: 15;
    background: var(--paper); padding: 4px 0 10px;
  }
  .search-bar input {
    width: 100%; border: 1px solid var(--paper-line); background: var(--surface); color: var(--ink);
    border-radius: 10px; padding: 10px 12px; font-size: 16px;
  }
  .search-bar input:focus { outline: 2px solid var(--pine); outline-offset: 1px; }
  /* iPhone 的 Safari 会给输入框套上自己的外观（搜索框尤其明显），统一成页面自己的样式 */
  .search-bar input, .gate input, .modal-body textarea,
  .modal-body input[type=text], .modal-body input[type=password], .modal-body input[type=email] { -webkit-appearance: none; appearance: none; }
  .search-bar input::-webkit-search-decoration { -webkit-appearance: none; }
  /* 只对 iPhone / iPad 生效：日期框默认按内容定宽、文字居中，和上下的输入框对不齐 */
  @supports (-webkit-touch-callout: none) {
    .modal-body input[type=date], .modal-body input[type=time] { -webkit-appearance: none; appearance: none; display: block; min-width: 0; text-align: left; }
    .modal-body input[type=date]::-webkit-date-and-time-value, .modal-body input[type=time]::-webkit-date-and-time-value { text-align: left; }
  }

  .section-title { font-size: 13px; color: var(--ink-soft); margin: 16px 2px 6px; }

  /* 小组筛选条：横向滑动，不占竖向空间 */
  .group-bar {
    display: flex; gap: 6px; overflow-x: auto; margin-top: 8px; padding-bottom: 2px;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .group-bar::-webkit-scrollbar { display: none; }
  .group-chip {
    flex-shrink: 0; border: 1px solid var(--paper-line); background: var(--surface);
    color: var(--ink-soft); border-radius: 999px; padding: 6px 13px; font-size: 13px; cursor: pointer;
    font-family: inherit; white-space: nowrap;
  }
  .group-chip.active { background: var(--pine); border-color: var(--pine); color: var(--paper); }
  /* 弹窗里的点选器换行显示：选组要一眼看全，不该藏在横向滚动里 */
  .group-picker { flex-wrap: wrap; overflow-x: visible; row-gap: 8px; margin-bottom: 4px; }
  .member-group { font-size: 11.5px; color: var(--ink-soft); font-weight: 400; }
  .roster-group-head {
    font-size: 12.5px; color: var(--pine); font-weight: 600; margin: 16px 2px 7px;
    display: flex; align-items: center; gap: 8px;
  }
  .roster-group-head::after { content: ''; flex: 1; height: 1px; background: var(--paper-line); }
  /* 打饭台的分组标题贴在列表上方，比名册页紧凑一点 */
  .serve-group-head { margin: 12px 2px 6px; }
  .serve-group-head:first-of-type { margin-top: 2px; }

  .member-row {
    background: var(--surface); border: 1px solid var(--paper-line);
    border-radius: 12px; padding: 12px; margin-bottom: 8px;
  }
  .member-row.exhausted { background: var(--pine-soft); border-color: var(--pine); }
  .member-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .member-name-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .member-name { font-size: 16px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font-size: 11px; padding: 3px 9px; border-radius: 999px; white-space: nowrap; border: none; font-family: inherit; }
  button.badge { cursor: pointer; }
  .badge-paid { background: var(--pine-soft); color: var(--pine-dark); }
  .badge-unpaid { background: var(--amber-soft); color: var(--amber); }
  .badge-none { background: var(--paper-line); color: var(--ink-soft); }

  .punches { display: flex; gap: 8px; margin-top: 10px; }
  .punch {
    width: 38px; height: 38px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-family: var(--font-display); font-weight: 600;
    border: 1.6px dashed var(--paper-line); color: var(--ink-soft);
    position: relative; flex-shrink: 0; touch-action: manipulation;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  /* 圆圈外再加一圈看不见的可点范围（约 46px 见方）：
     手指比圆圈粗，点在圆圈的「四个角」上也要算点中 */
  .punch.next::before, .punch.filled::before { content: ''; position: absolute; top: -5.5px; right: -5.5px; bottom: -5.5px; left: -5.5px; }
  .punch.filled { border-style: solid; border-color: var(--pine); background: var(--pine); color: var(--paper); cursor: pointer; }
  .punch.next { border-color: var(--pine); color: var(--pine); font-size: 17px; cursor: pointer; }
  .punch.pending { opacity: .55; }
  .punch.disabled { opacity: .4; }

  .quick-issue-btn {
    font-size: 12.5px; color: var(--pine); background: var(--pine-soft);
    border: none; border-radius: 8px; padding: 6px 10px; cursor: pointer; white-space: nowrap;
  }

  .fab {
    position: fixed; right: 16px; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 25;
    right: max(16px, env(safe-area-inset-right, 0px));   /* 横屏时别钻到刘海底下 */
    background: var(--amber); color: #fff; border: none; border-radius: 999px;
    padding: 13px 18px; font-size: 14.5px; font-weight: 600;
    box-shadow: 0 6px 16px rgba(0,0,0,.18); cursor: pointer;
  }

  .empty-state { text-align: center; color: var(--ink-soft); padding: 40px 12px; font-size: 14px; line-height: 1.7; }

  /* ---------- roster ---------- */
  .roster-row {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--surface); border: 1px solid var(--paper-line);
    border-radius: 12px; padding: 12px; margin-bottom: 8px; cursor: pointer;
  }
  .roster-row .rn { font-size: 15.5px; font-weight: 600; }
  .roster-row .rp { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .chev { color: var(--ink-soft); font-size: 18px; }
  .roster-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }   /* 名册：没有饭卡的人旁边的「开卡」 */
  /* 打饭台：名册里没有饭卡的人（搜名字时才出现在下面） */
  .member-row.nocard { background: var(--paper); border-style: dashed; }
  .serve-note { text-align: center; margin: 12px 4px 0; }
  .serve-more { text-align: center; margin: 4px 4px 0; }
  /* 修改记录 */
  .hist-note { margin: 0 0 8px; }
  .hist-actors { margin: 0 0 6px; }
  .hist-day { font-size: 12.5px; color: var(--pine); font-weight: 600; margin: 12px 2px 2px; }
  .hist-item { padding: 7px 2px; border-bottom: 1px solid var(--paper-line); }
  .hist-head { display: flex; gap: 8px; align-items: baseline; font-size: 12px; color: var(--ink-soft); }
  .hist-who { font-weight: 600; color: var(--ink); }
  .hist-text { font-size: 14px; margin-top: 1px; line-height: 1.5; word-break: break-word; }
  .m-hist .hist-item:last-child { border-bottom: none; }
  .add-btn {
    width: 100%; border: 1.4px dashed var(--paper-line); background: none; color: var(--pine);
    border-radius: 12px; padding: 12px; font-size: 14.5px; font-weight: 600; cursor: pointer; margin-top: 4px;
  }

  /* ---------- 签到 ---------- */
  .att-datebar { display: flex; align-items: center; gap: 8px; margin: 2px 0 8px; }
  .att-nav {
    flex: 0 0 44px; height: 44px; border-radius: 12px; border: 1px solid var(--paper-line);
    background: var(--surface); color: var(--ink); font-size: 22px; line-height: 1; cursor: pointer; font-family: inherit;
  }
  .att-nav:disabled { opacity: .35; cursor: default; }
  .att-date {
    position: relative; flex: 1; min-width: 0; height: 44px; display: flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--paper-line); border-radius: 12px;
  }
  .att-date-main { font-family: var(--font-display); font-size: 17px; font-weight: 700; white-space: nowrap; }
  .att-date-sub { font-size: 12px; color: var(--ink-soft); white-space: nowrap; }
  .att-date-sub.is-today { color: var(--pine); font-weight: 600; }
  /* 日期本身就是一个看不见的下拉框：点日期就弹出周日列表（iPhone 是底部的滚轮） */
  #attDatePick {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0;
    border: 0; padding: 0; margin: 0; cursor: pointer; font-size: 16px; -webkit-appearance: none; appearance: none;
  }
  .att-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .att-stat {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; min-height: 48px; min-width: 0;
    padding: 6px 2px; border-radius: 12px; border: 1px solid var(--paper-line); background: var(--surface);
    color: var(--ink-soft); cursor: pointer; font-family: inherit;
  }
  .att-stat b { font-family: var(--font-display); font-size: 19px; line-height: 1.15; color: var(--ink); }
  .att-stat span { font-size: 11px; white-space: nowrap; }
  .att-stat.s-present b { color: var(--pine); }
  .att-stat.s-late b { color: var(--amber); }
  .att-stat.s-absent b { color: var(--brick); }

<script>
  /* 组件库（从 CDN 下载）加载失败时，模块脚本一行都不会执行，页面会永远停在「正在启动」。
     这里单独放一个不依赖任何库的小脚本：10 秒还没启动就给出提示和重试按钮。
     如果只是网慢、之后加载成功了，正常页面会自动把这段提示替换掉。 */
  setTimeout(function () {
    if (window.__mealcardBooted) return;
    var app = document.getElementById('app');
    if (!app) return;
    app.innerHTML = '<div class="gate"><h1>页面没能加载完</h1>'
      + '<p>网络不太好，或者页面需要的组件暂时下载不了。</p>'
      + '<div class="gate-actions"><button type="button" class="gate-btn" onclick="location.reload()">重试</button></div></div>';
  }, 10000);
</script>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm';

const $ = (id) => document.getElementById(id);

/* 日期一律按巴塞罗那时间算：有的管理员手机设的是北京时间，
   不固定时区的话，周日傍晚的打卡会被记成周一。 */
const TZ = 'Europe/Madrid';
const _madrid = new Intl.DateTimeFormat('en-US', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
function madridParts(d) { const o = {}; for (const p of _madrid.formatToParts(d)) o[p.type] = p.value; return o; }
function fmtDate(d) { const o = madridParts(d); return `${o.year}-${o.month}-${o.day}`; }
function fmtTime(d) { const o = madridParts(d); return `${o.hour}:${o.minute}`; }

/* 按日历算日期（'2026-10-04' 这种字符串），用正午 UTC 避开夏令时切换那天的坑 */

const weekdayOf = s => new Date(s + 'T12:00:00Z').getUTCDay();          // 0 = 周日
function addDays(s, n) { const d = new Date(s + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
const prevSunday = s => addDays(s, -(weekdayOf(s) || 7));               // s 之前的那个周日
const nextSunday = s => addDays(s, 7 - weekdayOf(s));                   // s 之后的那个周日
function fmtCn(s) { const p = String(s).split('-'); return `${+p[1]}月${+p[2]}日 ${WEEKDAY[weekdayOf(s)]}`; }

function toDate(s) { return s instanceof Date ? s : new Date(typeof s === 'string' && /^\d{4}-\d{2}-\d{2} \d/.test(s) ? s.replace(' ', 'T') : s); }

/* 记录的 ID 由手机自己生成：网络抖动时重发同一条也不会记成两条 */
function uuid() {
  if (window.crypto?.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16));

  if (/card_not_found|member_not_found/.test(m) || e?.code === '23503') return '这个人刚被另一台手机删除了，已刷新';
  if (/bad_date/.test(m)) return '不能给还没到的日子签到';

  if (/member_name_exists/.test(m)) return '名册里已经有这个名字了（可能是另一台手机刚加的）';

  if (e?.code === '40P01' || e?.code === '40001') return `两台手机同时改到了同一个人，${what === '保存失败' ? '这次没保存上' : what}，请再点一次`;
  if (isNetErr(e)) return `网络不太好，${what === '保存失败' ? '这次没保存上' : what}。网络恢复后页面会自动核对`;
  if (e?.status >= 500) return `Supabase 服务器暂时出错（${e.status}），${what === '保存失败' ? '这次没保存上' : what}，请稍后再试`;
  if (/JWT|expired|401|403/i.test(m)) return '登录已过期，请点右上角「退出」后重新登录';
  return `${what}：${m}`;
}

/* ---------- 弹窗 ---------- */
const modalStack = [];
function showModal({ title, bodyHtml = '', buttons = [] }) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';

  /* 触摸设备上的「幽灵点击」：手指抬起后，浏览器还会在同一坐标补发一次
     click。弹窗正是在手指抬起那一刻弹出来的，所以那一下会落在刚出现的
     弹窗上——要么把它立刻关掉，要么误按里面的按钮。
     判据不是时间，而是「这次 click 之前有没有在弹窗里按下过」：
     真实的点按一定是 pointerdown → click 成对出现；补发的那次只有 click。 */
  let pressedInside = false;
  overlay.addEventListener('pointerdown', () => { pressedInside = true; }, true);
  overlay.addEventListener('click', e => {
    const fromKeyboard = e.detail === 0;          // 键盘回车触发的 click 没有 pointerdown
    if (!pressedInside && !fromKeyboard) {
      e.stopImmediatePropagation();
      e.preventDefault();
    }
    pressedInside = false;
  }, true);

  const card = document.createElement('div');
  card.className = 'modal-card';
  card.innerHTML = `<div class="modal-title">${esc(title)}</div><div class="modal-body">${bodyHtml}</div>`;
  const actions = document.createElement('div');
  actions.className = 'modal-actions';
  const entry = { overlay };
  const close = () => {
    overlay.remove();
    const i = modalStack.indexOf(entry); if (i >= 0) modalStack.splice(i, 1);
  };
  entry.close = close;
  buttons.forEach(b => {
    const btn = document.createElement('button');
    btn.className = 'btn ' + (b.variant || 'btn-secondary');
    btn.textContent = b.label;
    btn.addEventListener('click', () => b.onClick && b.onClick(close));
    actions.appendChild(btn);
  });
  entry.primary = () => actions.querySelector('.btn-primary');
  card.appendChild(actions);
  overlay.appendChild(card);
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
  $('modal-root').appendChild(overlay);
  modalStack.push(entry);
  return { close, card };
}
/* 电脑上：Esc 关闭弹窗；在输入框里按回车 = 点主按钮（输入法选字时的回车不算） */
document.addEventListener('keydown', e => {
  const top = modalStack[modalStack.length - 1];
  if (!top) return;
  if (e.key === 'Escape') { e.preventDefault(); top.close(); return; }
  if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229 && e.target.tagName === 'INPUT'
      && top.overlay.contains(e.target)) {
    const p = top.primary();
    if (p) { e.preventDefault(); p.click(); }
  }
});

/* 打卡圆圈的点按识别。整页只挂一次，列表怎么重画都不受影响：
   - 手指按下时就记住按的是哪个圆圈（哪张卡、哪条记录），抬手时照记下的执行。
     这样哪怕按着的这一下列表刚好被重画、圆圈换成了新的，这次点按也不会丢；
   - 手指移动超过 12px 是在滑动翻页，不算点；浏览器接管成滚动（pointercancel）也不算；
   - 已打的孔：点一下，或者长按 0.48 秒，都弹出撤销确认；
   - 「+」按多久都算一次（跟手机上的普通按钮一样），只要手指没有滑走。 */
const TAP_SLOP = 12, LONG_PRESS_MS = 480;
let press = null;
function endPress() { if (press && press.timer) clearTimeout(press.timer); press = null; }
document.addEventListener('pointerdown', e => {
  if (press && performance.now() - press.t < 4000) return;   // 已经有一根手指按着，忽略第二根
  endPress();
  if (e.pointerType === 'mouse' && e.button !== 0) return;     // 鼠标右键、中键不算
  const el = e.target.closest && e.target.closest('#serveList .punch.next, #serveList .punch.filled');
  if (!el) return;
  const p = press = {
    id: e.pointerId, next: el.classList.contains('next'), data: { ...el.dataset },
    x: e.clientX, y: e.clientY, t: performance.now(), timer: null, fired: false
  };
  if (!p.next) p.timer = setTimeout(() => {
    if (press !== p) return;
    p.fired = true;
    vibrate(15);
    askRevoke(p.data.usage);
  }, LONG_PRESS_MS);
});
document.addEventListener('pointermove', e => {
  if (!press || e.pointerId !== press.id) return;
  if (Math.abs(e.clientX - press.x) > TAP_SLOP || Math.abs(e.clientY - press.y) > TAP_SLOP) endPress();
});
document.addEventListener('pointerup', e => {
  if (!press || e.pointerId !== press.id) return;
  const p = press;
  endPress();
  if (p.fired) return;                                          // 长按已经弹过框了
  if (p.next) punch(p.data.punchCard, p.data.punchMember);
  else askRevoke(p.data.usage);
});
document.addEventListener('pointercancel', e => { if (press && e.pointerId === press.id) endPress(); });
document.addEventListener('contextmenu', e => { if (e.target.closest && e.target.closest('.punch')) e.preventDefault(); });
const noop = () => {};

/* ============================================================
   状态
   ============================================================ */
let sb = null, SB_URL = '', SB_KEY = '';
/* 共用管理员账号：大家只输同一个密码。Supabase 里这个账号必须有个邮箱形式的名字，
   但它不用是真的邮箱，也不会收任何邮件（config.js 里可以改成别的）。 */
const SHARED_ACCOUNT_DEFAULT = 'admin@star-mealcard.pages.dev';
let SHARED_ACCOUNT = SHARED_ACCOUNT_DEFAULT;
const isShared = () => (state.user?.email || '').toLowerCase() === SHARED_ACCOUNT;
/* 每台手机记住上次用的是「打饭台」还是「签到」：门口签到的那台一打开就是签到，打饭的那台就是打饭台。
   名册、财务是偶尔去一下的，不记——下次打开还是回到干活的那一页 */
const TABS = ['serve', 'attend', 'roster', 'finance'];
const TAB_KEY = 'mealcard.tab';
function savedTab() { try { return localStorage.getItem(TAB_KEY) === 'attend' ? 'attend' : 'serve'; } catch { return 'serve'; } }
function rememberTab(t) { if (t !== 'serve' && t !== 'attend') return; try { localStorage.setItem(TAB_KEY, t); } catch {} }
const state = {
  user: null,
  members: [], cards: [], usages: [], cashLogs: [], expenses: [], attendance: [], settings: [],
  tab: savedTab(),
  finPeriod: 'month',   // 财务页「收支算账」看哪段时间：month / lastMonth / year / all
  search: '',
  group: '',            // '' = 全部小组，'__none__' = 未分组
  attDate: '',          // 签到页看的是哪个周日（每天第一次打开自动选：今天是周日就是今天，不然是上一个周日）
  attSearch: '', attGroup: '', attFilter: '',   // 签到页自己的搜索、小组、状态筛选（'' / present / late / rest = 未签或缺席）
  realtimeOk: false,
  pendingOps: 0
};
const TABLE_KEY = { members: 'members', meal_cards: 'cards', card_usages: 'usages', cash_logs: 'cashLogs', expenses: 'expenses',
                    attendance: 'attendance', app_settings: 'settings' };

/* 所有对本地数据的改动都走这几个函数，便于统一维护索引 */
let dataVersion = 0;
function upsertRow(table, row) {
  if (!row || !row.id) return;
  const arr = state[TABLE_KEY[table]];
  const i = arr.findIndex(x => x.id === row.id);
  if (i >= 0) { const m = { ...arr[i], ...row }; delete m._pending; arr[i] = m; }
  else arr.push({ ...row });
  dataVersion++;
}
function removeRow(table, id) {
  const k = TABLE_KEY[table];
  state[k] = state[k].filter(x => x.id !== id);
  dataVersion++;
}
function patchRow(table, id, patch) {
  const arr = state[TABLE_KEY[table]];
  const i = arr.findIndex(x => x.id === id);
  if (i >= 0) { arr[i] = { ...arr[i], ...patch }; dataVersion++; }
}
function setSnapshot(snap) {
  const dedupe = rows => [...new Map(rows.map(r => [r.id, r])).values()];
  state.members = dedupe(snap.members); state.cards = dedupe(snap.cards);
  state.usages = dedupe(snap.usages); state.cashLogs = dedupe(snap.cashLogs);
  state.expenses = dedupe(snap.expenses || []);
  state.attendance = dedupe(snap.attendance || []); state.settings = dedupe(snap.settings || []);
  dataVersion++;
}

/* ============================================================
   数据层
   ============================================================ */
/* Supabase 默认一次最多只给 1000 行，而且超出部分会被悄悄截掉。
   打卡记录大约八个月就会超过 1000 条，所以必须分页把全部取回来。 */
async function fetchAll(table) {
  const PAGE = 1000;
  const first = await sb.from(table).select('*', { count: 'exact' }).order('id').limit(PAGE);
  let rows = must(first) || [];
  const total = first.count;
  while (rows.length && (total == null ? rows.length % PAGE === 0 : rows.length < total)) {
    const more = must(await sb.from(table).select('*').order('id').gt('id', rows[rows.length - 1].id).limit(PAGE)) || [];
    if (!more.length) break;
    rows = rows.concat(more);
  }
  return rows;
}
async function loadAll() {
  const [members, cards, usages, cashLogs, expenses, attendance, settings] = await Promise.all(
    ['members', 'meal_cards', 'card_usages', 'cash_logs', 'expenses', 'attendance', 'app_settings'].map(fetchAll));
  return { members, cards, usages, cashLogs, expenses, attendance, settings };
}

/* 全量刷新：断线重连、解锁屏幕、网络恢复、手动刷新时调用。
   刷新途中如果本机正在保存，或者期间收到了实时推送，都要妥善合并，
   不能用一份「过时的快照」把刚打上的卡盖掉。 */
let writeSeq = 0, reloadPromise = null, reloadQueued = false, liveEvents = null, lastFullLoad = 0;
function fullReload({ silent = true } = {}) {
  if (reloadPromise) { reloadQueued = true; return reloadPromise; }
  reloadPromise = (async () => {
    let attempts = 0;
    do {
      reloadQueued = false;
      liveEvents = [];
      const seq = writeSeq;
      let snap;
      try { snap = await loadAll(); }
      catch (e) { liveEvents = null; if (!silent) throw e; console.warn('刷新失败', e); return false; }
      if ((state.pendingOps > 0 || writeSeq !== seq) && ++attempts < 10) { reloadQueued = true; await sleep(400); continue; }
      if (!state.user) { liveEvents = null; return false; }   // 这期间登录失效了：拿到的是空数据，不能用
      const events = liveEvents; liveEvents = null;
      setSnapshot(snap);
      for (const ev of events) applyEvent(ev);
      lastFullLoad = Date.now();
      render();
    } while (reloadQueued);
    return true;
  })().finally(() => { reloadPromise = null; liveEvents = null; });
  return reloadPromise;
}

/* 实时同步：收到变化就直接合并那一行，不必每次都整表重拉 */
let channel = null, renderTimer = null;
function applyEvent(ev) {
  if (ev.type === 'DELETE') { if (ev.old?.id) removeRow(ev.table, ev.old.id); }
  else upsertRow(ev.table, ev.row);
}
function scheduleRender() {
  if (renderTimer) return;
  renderTimer = setTimeout(() => { renderTimer = null; render(); }, 60);
}
function subscribeRealtime() {
  if (channel) return;
  channel = sb.channel('mealcard-sync');
  for (const t of Object.keys(TABLE_KEY)) {
    channel.on('postgres_changes', { event: '*', schema: 'public', table: t }, p => {
      const ev = { table: p.table, type: p.eventType, row: p.new, old: p.old };
      if (liveEvents) liveEvents.push(ev);
      applyEvent(ev);
      scheduleRender();
      pokeHistory();
    });
  }
  channel.subscribe(status => {
    const was = state.realtimeOk;
    state.realtimeOk = status === 'SUBSCRIBED';
    paintSyncDot();
    // 每次（重新）连上都补拉一次：断线期间别人的操作不会自动补发过来
    if (state.realtimeOk && !was && Date.now() - lastFullLoad > 1500) fullReload();
  });
}

/* 兜底：手机锁屏再解锁、网络恢复、实时同步断了，都要自己把数据补回来 */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && sb && state.user && $('main')) fullReload();
});
addEventListener('online', () => { if (sb && state.user) fullReload(); });
let ticks = 0;
setInterval(() => {
  if (!sb || !state.user || !$('main') || document.visibilityState !== 'visible') return;
  ticks++;
  if (!state.realtimeOk) fullReload();              // 实时同步不通：每 30 秒兜底刷新
  else if (ticks % 4 === 0) quickCheck();           // 实时同步正常：每 2 分钟轻量核对条数
  if (state.tab === 'attend' && attAutoFor && attAutoFor !== todayStr()) render();   // 过了午夜：签到页换到新的一天
}, 30000);
async function quickCheck() {
  try {
    const tables = Object.keys(TABLE_KEY);
    const res = await Promise.all(tables.map(t => sb.from(t).select('id', { count: 'exact', head: true })));
    if (res.some(r => r.error)) return;
    if (res.some((r, i) => r.count !== state[TABLE_KEY[tables[i]]].filter(x => !x._pending).length)) fullReload();
  } catch {}
}

/* 网络抖动时自动重试：只重试「网络不通」和网关临时出错（502/503/504）这几类。
   新增的记录 ID 是手机生成的，重发也不会记成两条，所以重试是安全的。 */
/* 两台手机在同一瞬间改到同一个人（比如一台在删他、一台正给他打卡）时，数据库偶尔会判定两边「互相等」，
   撤销其中一边的操作（死锁）。被撤销的那一边什么都没改，隔一下重做一次就行，不用让人看到报错 */
const PG_RETRY = ['40P01', '40001'];     // deadlock_detected、serialization_failure
const isTransient = e => isNetErr(e) || [502, 503, 504].includes(e?.status) || PG_RETRY.includes(e?.code);
async function withRetry(fn, tries = 3) {
  for (let i = 0; ; i++) {
    try { return await fn(); }
    catch (e) { if (!isTransient(e) || i >= tries - 1) throw e; await sleep([600, 1500][i] || 1500); }
  }
}
/* 新增一行。ID 由手机生成，所以重发时如果发现"已经存在"，说明上一次其实成功了 */
async function insertRow(table, row) {
  let attempt = 0;
  return withRetry(async () => {
    attempt++;
    try { return must(await sb.from(table).insert(row).select().single()); }
    catch (e) {
      // 重发时报错（「已存在」「卡已用满」等），可能是因为第一次其实已经存上了、只是回复丢了：
      // 数据库里真有这一条，就算成功，不要误报失败
      if (attempt > 1) {
        const got = await sb.from(table).select('*').eq('id', row.id).maybeSingle();
        if (!got.error && got.data) return got.data;
      }
      throw e;
    }
  });
}
/* 调用数据库里的函数：网络抖动时自动重发。函数本身按 ID 去重，重发不会记两次；
   万一重发时报错，先看看第一次是不是其实已经存上了 */
async function callWithRetry(fn, args, table, id) {
  let attempt = 0;
  return withRetry(async () => {
    attempt++;
    try { return must(await sb.rpc(fn, args)); }
    catch (e) {
      if (attempt > 1) {
        const got = await sb.from(table).select('*').eq('id', id).maybeSingle();
        if (!got.error && got.data) return got.data;
      }
      throw e;
    }
  });
}
const updateRow = (table, id, patch) => withRetry(async () => must(await sb.from(table).update(patch).eq('id', id).select().single()));
const deleteRow = (table, id) => withRetry(async () => { must(await sb.from(table).delete().eq('id', id)); });

/* 乐观写入：先本地改+重绘（手感零延迟），再发服务器；失败则回滚并说明原因 */
async function optimistic(applyLocal, rollback, serverCall, { what = '保存失败', handled = null, resync = false } = {}) {
  state.pendingOps++; writeSeq++;
  applyLocal();
  render();
  try {
    await serverCall();
  } catch (e) {
    // 另一台手机抢先一步造成的冲突（卡刚用满、人刚被删……）是预料之中的，已经用中文提示了，只记个警告
    const conflict = /card_full|card_archived|card_replaced|card_not_found|member_not_found|member_has_active_card|already_used_today/.test(e.message) || ['PGRST116', '23503'].includes(e.code);
    (conflict ? console.warn : console.error)(e);
    rollback();
    render();
    if (!(handled && handled(e))) toast(friendly(e, what), 4200);
    // 冲突，或者要求失败后重新核对的（签到）：回滚的是本机记得的旧样子，期间别的手机可能改过，拉一遍最新的
    if (conflict || resync) fullReload();
    return false;
  } finally {
    state.pendingOps--;
  }
  render();
  return true;
}

/* ============================================================
   派生数据（按版本号缓存索引，几千条记录也不卡）
   ============================================================ */
let _idx = null, _idxVer = -1;
function index() {
  if (_idx && _idxVer === dataVersion) return _idx;
  const usagesByCard = new Map(), cardsByMember = new Map(), memberMap = new Map();
  for (const m of state.members) memberMap.set(m.id, m);
  for (const u of state.usages) { let a = usagesByCard.get(u.card_id); if (!a) usagesByCard.set(u.card_id, a = []); a.push(u); }
  for (const c of state.cards) { let a = cardsByMember.get(c.member_id); if (!a) cardsByMember.set(c.member_id, a = []); a.push(c); }
  for (const a of usagesByCard.values()) a.sort((x, y) => (x.used_date < y.used_date ? -1 : x.used_date > y.used_date ? 1 : toDate(x.created_at) - toDate(y.created_at)));
  for (const a of cardsByMember.values()) a.sort((x, y) => toDate(y.created_at) - toDate(x.created_at));
  // 签到：按日期 → 人。同一个人同一天只该有一条；万一本机「还在保存」的那条和服务器推来的那条同时在，以服务器的为准
  const attByDate = new Map(), attByMember = new Map(), mealByDate = new Map();
  for (const a of state.attendance) {
    let d = attByDate.get(a.att_date); if (!d) attByDate.set(a.att_date, d = new Map());
    const prev = d.get(a.member_id);
    if (!prev || (prev._pending && !a._pending)
        || (!prev._pending === !a._pending && String(a.updated_at || '') > String(prev.updated_at || ''))) d.set(a.member_id, a);
  }
  for (const d of attByDate.values()) for (const a of d.values()) {
    let l = attByMember.get(a.member_id); if (!l) attByMember.set(a.member_id, l = []); l.push(a);
  }
  for (const l of attByMember.values()) l.sort((x, y) => (x.att_date < y.att_date ? 1 : -1));   // 新的在前
  for (const u of state.usages) { let x = mealByDate.get(u.used_date); if (!x) mealByDate.set(u.used_date, x = new Set()); x.add(u.member_id); }
  _idx = { usagesByCard, cardsByMember, memberMap, attByDate, attByMember, mealByDate }; _idxVer = dataVersion;
  return _idx;
}

/* 名单一律按「小组 → 组内拼音/姓名」排，跟添加先后无关。
   1组的人永远排在 2组前面，没分组的排最后。 */
function compareMembers(a, b) {
  const ra = groupRank(a), rb = groupRank(b);
  if (ra !== rb) return ra - rb;
  const ga = groupOf(a), gb = groupOf(b);
  if (ga !== gb) return ga.localeCompare(gb, 'zh');   // 同级的非数字组名，按名称排
  const pa = (a.pinyin || '').toLowerCase(), pbb = (b.pinyin || '').toLowerCase();
  if (pa && pbb && pa !== pbb) return pa < pbb ? -1 : 1;
  if (pa && !pbb) return -1;
  if (!pa && pbb) return 1;
  return (a.name || '').localeCompare(b.name || '', 'zh');
}
function activeMembers() {
  return state.members.filter(m => m.active !== false).sort(compareMembers);
}
/* 小组的排序权重：1组=1 … 6组=6，非数字组名排在数字组之后，未分组永远最后 */
function groupRank(m) {
  const g = groupOf(m);
  if (!g) return 9999;
  const n = parseInt(g, 10);
  return isNaN(n) ? 5000 : n;
}
const memberById = id => index().memberMap.get(id);
function groupOf(m) { return (m && m.group_name) || ''; }

/* 固定的 1~6 组。添加/导入/改组时直接点选，不用每次手打。 */
const GROUP_PRESETS = ['1组', '2组', '3组', '4组', '5组', '6组'];

/* 带数字的组名按数字排，"10组" 才不会排到 "2组" 前面 */
function compareGroups(a, b) {
  const na = parseInt(a, 10), nb = parseInt(b, 10);
  if (!isNaN(na) && !isNaN(nb) && na !== nb) return na - nb;
  return a.localeCompare(b, 'zh');
}
/* 现有的小组清单（名册里真的有人的那些） */
function groupList() {
  const set = new Set();
  activeMembers().forEach(m => { if (groupOf(m)) set.add(groupOf(m)); });
  return [...set].sort(compareGroups);
}
/* 点选器里要列出的组：1~6 组固定显示，另外补上名册里出现过的其它组名 */
function groupChoices() {
  const set = new Set(GROUP_PRESETS);
  groupList().forEach(g => set.add(g));
  return [...set].sort(compareGroups);
}

    pick('#histActors').className = actors.size > 1 ? 'group-bar hist-actors' : '';
    pick('#histActors').innerHTML = actors.size > 1 ? [['', '全部'], ...actors].map(([v, l]) =>
      `<button type="button" class="group-chip${st.actor === v ? ' active' : ''}" data-actor="${esc(v)}">${esc(l)}</button>`).join('') : '';
    const shown = st.actor ? groups.filter(g => g.key === st.actor) : groups;
    pick('#histList').innerHTML = shown.length ? logItemsHtml(shown) : `<div class="empty-state">${st.rows.length ? '这个人还没有改过什么' : '还没有修改记录'}</div>`;
    pick('#histMore').hidden = st.done;
  };
  // 新读到的并进来：同一条只留一份（两次刷新撞在一起也不会重复）
  const add = rows => { let n = 0; for (const r of rows) if (!st.ids.has(r.id)) { st.ids.add(r.id); st.rows.push(r); n++; } if (n) st.rows.sort((a, b) => b.id - a.id); return n; };
  const load = async more => {
    if (st.busy) return; st.busy = true;
    try {
      const rows = await fetchLog({ before: more && st.rows.length ? st.rows[st.rows.length - 1].id : null });
      add(rows);
      st.done = rows.length < 150;
      paint();
    } catch (e) {
      if (st.rows.length) toast(friendly(e, '没读到修改记录'), 3600);
      else pick('#histList').innerHTML = `<div class="empty-state">${esc(friendly(e, '没读到修改记录'))}</div>`;
    } finally {
      st.busy = false;
      if (st.again) { st.again = false; pokeHistory(); }
    }
  };
  pick('#histActors').addEventListener('click', e => { const b = e.target.closest('[data-actor]'); if (b) { st.actor = b.dataset.actor; paint(); } });
  pick('#histMore').addEventListener('click', () => load(true));
  pick('#histExport').addEventListener('click', e => exportHistoryClick(e.currentTarget));
  histUI = {
    card,
    refresh: async () => {
      if (st.busy || st.refreshing) { st.again = true; return; }
      if (!st.rows.length) return load(false);                 // 打开时还是空的（比如刚升级完）：整个重读
      st.refreshing = true;
      try {
        // 从手上最新的那条往回多看 50 条：先开始、后完成的那笔操作（编号小一点、晚一点才出现）也补得上
        let after = Math.max(0, st.rows[0].id - 50), n = 0;
        for (let i = 0; i < 20; i++) {
          const rows = await fetchLog({ after, limit: 500 });
          n += add(rows);
          if (rows.length < 500) break;
          after = rows[rows.length - 1].id;
        }
        if (n && card.isConnected) paint();
      } catch {}
      finally {
        st.refreshing = false;
        if (st.again) { st.again = false; pokeHistory(); }
      }
    }
  };
  load(false);
}
let histTimer = null;
function pokeHistory() {
  if (!histUI || !histUI.card.isConnected) { histUI = null; return; }
  clearTimeout(histTimer);
  histTimer = setTimeout(() => histUI && histUI.card.isConnected && histUI.refresh(), 700);
}

/* 名册里点开一个人：他的修改记录（最近 12 次操作） */
async function loadMemberHistory(memberId, el) {

    if (el.isConnected) el.innerHTML = groups.length ? logItemsHtml(groups) : '<div class="list-meta">还没有修改记录（升级到第 8 版以后的改动才有）</div>';
  } catch (e) { if (el.isConnected) el.innerHTML = `<div class="list-meta">${esc(friendly(e, '没读到修改记录'))}</div>`; }
}

/* 导出修改记录：全部，一次操作一行 */
async function buildHistoryCsv() {
  let all = [], before = null;
  for (;;) {
    const rows = await fetchLog({ before, limit: 1000 });
    all = all.concat(rows);
    if (rows.length < 1000) break;
    before = rows[rows.length - 1].id;
  }
  const groups = groupLog(all).reverse();                       // 表里从早到晚
  const fmtAt = s => { const d = toDate(s); return `${fmtDate(d).replace(/-/g, '/')} ${fmtTime(d)}`; };
  const head = ['时间', '谁', '登录账号', '做了什么'];
  const body = groups.map(g => [fmtAt(g.at), g.who, g.email, g.lines.join('；')]);
  const csv = '﻿' + [['繁星团契修改记录', '', '', ''], head, ...body].map(r => r.map(csvCell).join(',')).join('\r\n');
  return { name: `changelog_${todayStr()}.csv`, csv, msg: `已导出 ${body.length} 条修改记录`, count: body.length };
}
/* iPhone 上，分享面板 / 下载只能在「点一下」的那一刻打开；读全部记录要一点时间，
   所以 iPhone 上分两下：先准备好，按钮变成「准备好了，点这里保存」，再点一下才保存 */
async function exportHistoryClick(btn) {
  const LABEL = '导出修改记录 (CSV)';
  if (btn._ready) { const r = btn._ready; btn._ready = null; btn.textContent = LABEL; saveCsv(r.name, r.csv, r.msg); return; }
  if (btn.disabled) return;
  btn.disabled = true; btn.textContent = '正在准备…';
  let r = null;
  try { r = await buildHistoryCsv(); } catch (e) { toast(friendly(e, '导出失败'), 4200); }
  btn.disabled = false; btn.textContent = LABEL;
  if (!r || !btn.isConnected) return;
  if (platformInfo().ios) { btn._ready = r; btn.textContent = `准备好了（${r.count} 条），点这里保存`; return; }
  saveCsv(r.name, r.csv, r.msg);
}

/* ---------- 自己的账号：名字 ----------
   小组长各用自己的账号登录；名字写进登录信息里，数据库按它记「谁做的」。共用账号不问名字（大家共用，记成 admin） */
const myUser = () => String(state.user?.email || '').split('@')[0].slice(0, 30);
const myName = () => String(state.user?.user_metadata?.name || '').trim();
/* 记录上写的「谁」：和数据库记的一模一样——填了名字的写「名字（账号）」，没填的写账号。
   名字是各人自己填的，后面带上管理员建的账号，谁也冒充不了谁 */
const myActor = () => { const u = myUser(), n = myName(); return !u ? '' : (!n || n === u) ? u : `${n.slice(0, 20)}（${u}）`; };
const whoAmI = () => isShared() ? '共用账号' : (myName() || myUser());
function askMyName(force = false) {
  if (!state.user || isShared()) return;
  const cur = (state.user.user_metadata?.name || '').trim();
  if (cur && !force) return;
  showModal({
    title: force ? '改名字' : '你叫什么名字？',
    bodyHtml: `${force ? '' : '第一次用自己的账号登录，填一下名字。<br>'}<div class="field-label">名字（比如：李明）。「修改记录」和各条记录上会写成「名字（${esc(myUser())}）」，后面是你的账号</div>
      <input id="myName" type="text" maxlength="20" value="${esc(cur)}" autocomplete="off" enterkeyhint="done">`,
    buttons: [
      { label: force ? '取消' : '以后再说', variant: 'btn-ghost', onClick: c => c() },
      { label: '保存', variant: 'btn-primary', onClick: c => { const v = $('myName').value.trim(); if (!v) { toast('请填一个名字'); return; } c(); saveMyName(v); } }
    ]
  });
  setTimeout(() => $('myName')?.focus(), 60);
}
async function saveMyName(v) {
  try {
    const up = await sb.auth.updateUser({ data: { name: v } });
    if (up.error) throw up.error;
    const rs = await sb.auth.refreshSession();                 // 新名字要进登录凭证，数据库才认得
    if (rs.error) throw rs.error;

}

/* ---------- 拼音首字母（名单导入和单个添加都自动生成；取不到也不影响使用）---------- */
let _pinyinMod = null;
async function pinyinOf(name) {
  if (!/[一-龥]/.test(name)) return '';
  try {
    _pinyinMod = _pinyinMod || await import('https://cdn.jsdelivr.net/npm/pinyin-pro@3.19.6/+esm');
    return _pinyinMod.pinyin(name, { pattern: 'first', toneType: 'none', type: 'array' }).join('').replace(/[^a-z]/gi, '').toLowerCase();
  } catch { return ''; }
}

/* ============================================================
   动作
   ============================================================ */
/* 一张卡可以一天用好几次（本人同意让别人用），所以同日重复不再拦截，
   只在第二次起弹确认，挡住手滑点错的情况。 */
function punch(cardId, memberId) {
  const sameDay = usagesOf(cardId).filter(u => u.used_date === todayStr()).length;
  if (sameDay > 0) return askRepeat(cardId, memberId);
  doPunch(cardId, memberId, false);
}

/* 这张卡今天已经用过：确认后才再扣一次（帮别人打饭的情况） */
function askRepeat(cardId, memberId, maybeOtherPhone = false) {
  const m = memberById(memberId);
  const n = Math.max(1, usagesOf(cardId).filter(u => u.used_date === todayStr()).length);
  showModal({
    title: '这张卡今天已经用过了',
    bodyHtml: `${esc(m?.name || '')} 的卡今天已经用了 <strong>${n}</strong> 次${maybeOtherPhone ? '（可能是另一台手机刚打的）' : ''}。<br><br>如果是帮别人打饭，点「再用一次」；如果是刚才点错了，点取消。`,
    buttons: [
      { label: '取消', variant: 'btn-ghost', onClick: close => close() },
      { label: '再用一次', variant: 'btn-primary', onClick: close => { close(); doPunch(cardId, memberId, true); } }
    ]
  });
}

/* repeat = 已经有人确认过「今天再用一次」。
   没确认的情况下，数据库发现这张卡今天已经用过（比如另一台手机同一秒刚打过），会拦下来，
   这边就弹确认框，而不是悄悄多扣一次。 */
async function doPunch(cardId, memberId, repeat = false) {
  const card = state.cards.find(c => c.id === cardId);
  if (!card) return;
  const row = { id: uuid(), card_id: cardId, member_id: memberId, used_date: todayStr(), created_at: new Date().toISOString(), created_by: myActor(), _pending: true };
  const willExhaust = usagesOf(cardId).length + 1 >= 5;
  const prevStatus = card.status;
  let usedToday = false;
  // 只发一个请求：卡的「已用完」状态由数据库自动维护，不会出现半截成功
  const ok = await optimistic(
    () => { upsertRow('card_usages', row); if (willExhaust) patchRow('meal_cards', cardId, { status: 'EXHAUSTED' }); },
    () => { removeRow('card_usages', row.id); patchRow('meal_cards', cardId, { status: prevStatus }); },
    async () => upsertRow('card_usages', await callWithRetry('mealcard_punch', { p_id: row.id, p_card: cardId, p_repeat: repeat }, 'card_usages', row.id)),
    { handled: e => (usedToday = /already_used_today/.test(e?.message || '')) }
  );
  if (usedToday) { askRepeat(cardId, memberId, true); return; }
  if (ok && willExhaust) {
    vibrate(200);
    toast('该卡已用完，请提醒TA下次购卡！', 3600);
  }
}

async function revokeUsage(usage) {
  const card = state.cards.find(c => c.id === usage.card_id);
  const prevStatus = card ? card.status : null;
  const backup = { ...usage }; delete backup._pending;
  // 跟数据库的规则一致：这个人如果已经有别的使用中的卡，旧卡撤销一次后仍算「已用完」
  const otherActive = !!card && state.cards.some(c => c.member_id === card.member_id && c.status === 'ACTIVE' && c.id !== card.id);
  // 走数据库里的函数：另一台手机刚给这个人换了新卡时，它会拦下来（旧卡上的记录不能再撤销）
  await optimistic(
    () => { removeRow('card_usages', usage.id); if (card && prevStatus === 'EXHAUSTED' && !otherActive) patchRow('meal_cards', card.id, { status: 'ACTIVE' }); },
    () => { upsertRow('card_usages', backup); if (card) patchRow('meal_cards', card.id, { status: prevStatus }); },
    () => withRetry(async () => { must(await sb.rpc('mealcard_revoke', { p_id: usage.id })); })
  );
}

async function setPaid(cardId, paid) {
  const card = state.cards.find(c => c.id === cardId);
  if (!card) return;
  const before = { is_paid: card.is_paid, paid_at: card.paid_at ?? null };
  const ok = await optimistic(
    () => patchRow('meal_cards', cardId, { is_paid: paid, paid_at: paid ? new Date().toISOString() : null }),
    () => patchRow('meal_cards', cardId, before),
    async () => upsertRow('meal_cards', await updateRow('meal_cards', cardId, { is_paid: paid }))
  );
  if (ok) toast(paid ? '已标记为收款' : '已改回未付款');
}

/* allowDup = 已经确认过「就是要再加一个同名的」。
   没确认时，数据库发现已经有这个名字（比如另一台手机同一秒刚加过），会拦下来，这边就问一下。 */
async function addMember(name, pinyin, groupName, allowDup = false, after = null) {
  if (!pinyin) pinyin = await pinyinOf(name);
  const id = uuid();
  state.pendingOps++; writeSeq++;
  try {
    const saved = await callWithRetry('mealcard_add_member',
      { p_id: id, p_name: name, p_pinyin: pinyin || '', p_group: groupName || '', p_allow_dup: allowDup }, 'members', id);
    upsertRow('members', saved);
    render();
    toast('已添加 ' + name);
    if (after) after(saved);
  } catch (e) {
    if (/member_name_exists/.test(e?.message || '')) {
      // 把数据库里同名的人拿过来（可能是另一台手机刚加的），再问清楚
      try { const res = await sb.from('members').select('*').eq('name', name); for (const x of res.data || []) upsertRow('members', x); } catch {}
      render();
      if (!askSameName(name, pinyin, groupName, after)) toast('名册里已经有「' + name + '」了', 4200);
    } else {
      toast(friendly(e, '添加失败'), 4200);
    }
  } finally { state.pendingOps--; }
}

/* 名册里已经有同名的人：先问清楚是再加一个同名的，还是恢复原来那个。问了就返回 true。
   after：加好（或恢复好）以后接着做的事——签到页加新朋友时是「马上签到」 */
function askSameName(name, py, grp, after = null) {
  const same = state.members.filter(m => m.name === name);
  const visible = same.find(m => m.active !== false);
  const hidden = same.find(m => m.active === false);
  if (visible) {
    const buttons = [{ label: '不加了', variant: 'btn-ghost', onClick: c => c() },
                     { label: '仍然添加', variant: 'btn-secondary', onClick: c => { c(); addMember(name, py, grp, true, after); } }];
    const verb = after?.verb || '签到';
    if (after) buttons.push({ label: `就是他，直接${verb}`, variant: 'btn-primary', onClick: c => { c(); after(visible); } });
    showModal({
      title: `名册里已经有「${name}」了`,
      bodyHtml: `已有的这位在 <strong>${esc(groupOf(visible) || '未分组')}</strong>。${after ? `如果就是这个人，直接给他${verb}；` : ''}确定要再加一个同名的吗？打饭台上会出现两个「${esc(name)}」。`,
      buttons
    });
    return true;
  }
  if (hidden) {
    showModal({
      title: `「${name}」之前被隐藏了`,
      bodyHtml: `恢复原来的记录，他以前的饭卡、打卡和签到历史都还在。`,
      buttons: [
        { label: '另建一个新的', variant: 'btn-ghost', onClick: c => { c(); addMember(name, py, grp, true, after); } },
        { label: '恢复原来的', variant: 'btn-primary', onClick: async c => {
            c();
            const ok = await updateMember(hidden.id, { active: true, ...(grp ? { group_name: grp } : {}) }, after ? '' : '已恢复 ' + name);
            if (ok && after) after(memberById(hidden.id));
          } }
      ]
    });
    return true;
  }
  return false;
}

/* 删除一个人之前先说清楚后果。
   没有任何饭卡、打饭记录的（比如刚加错的名字）：确认一下就删。
   有记录的：他的饭卡和打饭记录会一起删掉，账目也会跟着变——建议改用「隐藏」。 */
function askDeleteMember(memberId) {
  const m = memberById(memberId);
  if (!m) return;
  const cards = cardsOf(memberId);
  const nUse = cards.reduce((s, c) => s + usagesOf(c.id).length, 0);
  const paidCards = cards.filter(c => c.is_paid).length;
  const nAtt = attHistory(memberId).length;
  if (!cards.length && !nAtt) {
    showModal({
      title: `删除「${m.name}」？`,
      bodyHtml: `${esc(m.name)} 还没有任何饭卡、打饭和签到记录，删掉不影响任何账目。<br>删除后不能恢复。`,
      buttons: [
        { label: '取消', variant: 'btn-ghost', onClick: c => c() },
        { label: '删除', variant: 'btn-danger', onClick: c => { c(); deleteMember(memberId); } }
      ]
    });
    return;
  }
  const buttons = [{ label: '取消', variant: 'btn-ghost', onClick: c => c() }];
  if (m.active !== false) buttons.push({ label: '改为隐藏', variant: 'btn-secondary', onClick: c => { c(); updateMember(memberId, { active: false }, `已隐藏 ${m.name}（名册最下面可以恢复）`); } });
  buttons.push({ label: '仍然删除', variant: 'btn-danger', onClick: c => { c(); deleteMember(memberId); } });
  const what = [cards.length ? `<strong>${cards.length}</strong> 张饭卡、<strong>${nUse}</strong> 次打饭记录` : '',
                nAtt ? `<strong>${nAtt}</strong> 条签到记录` : ''].filter(Boolean).join('、');
  showModal({
    title: `「${m.name}」有${cards.length ? '饭卡和打饭记录' : ''}${cards.length && nAtt ? '、' : ''}${nAtt ? '签到记录' : ''}`,
    bodyHtml: `彻底删除会把 ${esc(m.name)} 的 ${what}一起删掉${paidCards ? `（其中 ${paidCards} 张是已付款的，共 €${paidCards * 20}）` : ''}，${cards.length ? '财务统计和导出的 CSV' : '签到统计和导出的签到表'}里也会少掉这些。<strong>删除后不能恢复。</strong><br><br>如果只是以后不来了，建议用「隐藏」：名单里看不到，记录都保留，随时能恢复。`,
    buttons
  });
}

/* 彻底删除：数据库会把他的饭卡、打饭记录一起删掉（散客流水不受影响） */
async function deleteMember(memberId) {
  const m = memberById(memberId);
  if (!m) return;
  const cardIds = new Set(state.cards.filter(c => c.member_id === memberId).map(c => c.id));
  const backup = {
    members: state.members.filter(x => x.id === memberId),
    cards: state.cards.filter(c => c.member_id === memberId),
    usages: state.usages.filter(u => u.member_id === memberId || cardIds.has(u.card_id)),
    attendance: state.attendance.filter(a => a.member_id === memberId),
  };
  const ok = await optimistic(
    () => {
      state.members = state.members.filter(x => x.id !== memberId);
      state.cards = state.cards.filter(c => c.member_id !== memberId);
      state.usages = state.usages.filter(u => u.member_id !== memberId && !cardIds.has(u.card_id));
      state.attendance = state.attendance.filter(a => a.member_id !== memberId);
      dataVersion++;
    },
    () => {
      for (const x of backup.members) upsertRow('members', x);
      for (const x of backup.cards) upsertRow('meal_cards', x);
      for (const x of backup.usages) upsertRow('card_usages', x);
      for (const x of backup.attendance) upsertRow('attendance', x);
    },
    () => deleteRow('members', memberId),
    { what: '删除失败' }
  );
  if (ok) toast(`已删除 ${m.name}`);
}

async function updateMember(id, patch, doneMsg) {
  const m = memberById(id);
  if (!m) return false;
  const before = {}; for (const k of Object.keys(patch)) before[k] = m[k];
  const ok = await optimistic(
    () => patchRow('members', id, patch),
    () => patchRow('members', id, before),
    async () => upsertRow('members', await updateRow('members', id, patch))
  );
  if (ok && doneMsg) toast(doneMsg);
  return ok;
}

/* 开卡（需要时顺带作废旧卡）——数据库里一步完成，中途失败不会只作废了旧卡 */
async function issueCard(memberId, isPaid, replaceId = null) {
  const name = memberById(memberId)?.name || '';
  state.pendingOps++; writeSeq++;
  try {
    const saved = must(await sb.rpc('mealcard_issue_card', { p_member: memberId, p_paid: isPaid, p_replace: replaceId }));
    if (replaceId) patchRow('meal_cards', replaceId, { status: 'ARCHIVED' });
    upsertRow('meal_cards', saved);
    render();
    toast(`已为 ${name} 开通新的5次卡${isPaid ? '（已收20欧）' : '（暂未收款）'}`);
  } catch (e) {
    toast(friendly(e, '开卡失败'), 4200);
    fullReload();
  } finally { state.pendingOps--; }
}

async function addCashLog() {
  const row = { id: uuid(), log_date: todayStr(), amount: 4, operator: state.user?.email || null, created_at: new Date().toISOString(), created_by: myActor(), _pending: true };
  const ok = await optimistic(
    () => upsertRow('cash_logs', row),
    () => removeRow('cash_logs', row.id),
    async () => upsertRow('cash_logs', await insertRow('cash_logs', { id: row.id, amount: 4, operator: row.operator }))
  );
  if (ok) {
    const n = state.cashLogs.filter(l => l.log_date === todayStr()).length;
    toast(`已记录一笔散客 4欧（今天第 ${n} 位）`);
  }
}

async function deleteCashLog(id) {
  const backup = state.cashLogs.find(l => l.id === id);
  if (!backup) return;
  const ok = await optimistic(
    () => removeRow('cash_logs', id),
    () => upsertRow('cash_logs', backup),
    () => deleteRow('cash_logs', id)
  );
  if (ok) toast('已删除这笔散客记录');
}

/* ---------- 签到 ----------
   点「签到」：记下现在的时间，按时间自动判断准时还是迟到（数据库按服务器时间再判一次，以它为准）。
   已经签过的不会被改（另一台手机刚签过也一样）。改时间、改日期、补签，走下面的 setAttendance */
async function checkIn(memberId, date) {
  const m = memberById(memberId);
  if (!m) return;
  const old = attOf(memberId, date);
  if (old && old._pending) { toast('正在保存，稍等一下再改'); return; }
  if (old && old.status !== 'absent') { toast(`${m.name} 已经签过了（${attText(old)}）`); return; }
  const isToday = date === todayStr();
  const st = isToday && nowHM() >= lateAfter() ? 'late' : 'present';
  const nowIso = new Date().toISOString();
  const arrived = isToday ? nowIso : null;
  const temp = { id: uuid(), member_id: memberId, att_date: date, status: st, arrived_at: arrived, created_at: nowIso, updated_at: nowIso, created_by: myActor(), _pending: true };
  const backup = old ? { ...old } : null;
  let saved = null;
  const ok = await optimistic(
    () => old ? patchRow('attendance', old.id, { status: st, arrived_at: arrived, _pending: true }) : upsertRow('attendance', temp),
    () => old ? restorePending(backup) : removeRow('attendance', temp.id),
    async () => {
      const id = old ? old.id : temp.id;
      // 数据库里的签到函数重发多少次结果都一样（签过的保留第一次），所以直接重试
      saved = await withRetry(async () => must(await sb.rpc('mealcard_checkin', { p_id: id, p_member: memberId, p_date: date, p_status: null })));
      if (saved.id !== id) removeRow('attendance', id);   // 数据库里是另一条（比如另一台手机抢先签了）：以它为准
      upsertRow('attendance', saved);
    },
    { what: '签到没记上', resync: true }
  );
  if (!ok || !saved) return;
  const time = saved.arrived_at ? fmtTime(toDate(saved.arrived_at)) : '';
  if (!old && saved.id !== temp.id) toast(`${m.name} 刚被另一台手机签过了（${attText(saved)}）`, 3200);
  else if (saved.status === 'late') { vibrate(30); toast(`迟 ${m.name} 迟到${time ? '（' + time + '）' : ''}`); }
  else { vibrate(15); toast(`✓ ${m.name} 签到${time ? '（' + time + '）' : ''}`); }
}

/* 保存失败、回滚时：只把还是「本机正在保存」的那一行改回原样；期间别的手机推来的新版本不去盖 */
function restorePending(bak) {
  const cur = state.attendance.find(x => x.id === bak.id);
  if (cur && cur._pending) patchRow('attendance', bak.id, { ...bak, _pending: false });
}
/* 补签 / 改签到：哪一天、几点到的（可以不填）、准时还是迟到。
   from = 原来那条的日期：改了日期时，数据库把那条挪过去；目标那天已经有记录的，用这次的替换 */
async function setAttendance(memberId, { date, time = '', status, from = null }) {
  const move = from && from !== date ? from : null;
  const src = move ? attOf(memberId, move) : null;
  const dst = attOf(memberId, date);
  const nowIso = new Date().toISOString();
  const arrived = time ? madridIso(date, time) : null;
  const temp = { id: uuid(), member_id: memberId, att_date: date, status, arrived_at: arrived, created_at: nowIso, updated_at: nowIso, created_by: myActor(), _pending: true };
  const srcBak = src ? { ...src } : null, dstBak = dst ? { ...dst } : null;
  let saved = null;
  const ok = await optimistic(
    () => {
      if (src) removeRow('attendance', src.id);
      if (dst) patchRow('attendance', dst.id, { status, arrived_at: arrived, _pending: true });
      else upsertRow('attendance', temp);
    },
    () => {
      if (srcBak && !state.attendance.some(x => x.id === srcBak.id)) upsertRow('attendance', srcBak);
      if (dstBak) restorePending(dstBak); else removeRow('attendance', temp.id);
    },
    async () => {
      // 重发多少次结果都一样（那天写成这些值、原来那天的删掉），所以直接重试
      saved = await withRetry(async () => must(await sb.rpc('mealcard_set_attendance',
        { p_member: memberId, p_date: date, p_status: status, p_time: time || null, p_from_date: move })));
      const mine = dst ? dst.id : temp.id;
      if (saved.id !== mine) removeRow('attendance', mine);
      upsertRow('attendance', saved);
    },
    { what: '没保存上', resync: true }
  );
  return ok ? saved : null;
}
async function saveAttendance(memberId, { date, time = '', status, from = null, isNew = false }) {
  const name = memberById(memberId)?.name || '';
  const saved = await setAttendance(memberId, { date, time, status, from });
  if (!saved) return null;
  const what = `${name} · ${fmtCn(saved.att_date)} ${attText(saved)}`;
  toast(isNew ? `${saved.att_date === todayStr() ? '已签到' : '已补签'}：${what}` : `已改好：${what}`, 2800);
  return saved;
}

/* 撤销这一天的签到：回到没签到（日子过去了就算缺席）。seen = 打开表单时看到的那一条：
   表单开着的时候另一台手机改了（比如人到了改成迟到），就不撤销，免得把别人刚记的删掉 */
async function clearAttendance(memberId, date, seen = null) {
  const old = attOf(memberId, date);
  if (!old) return;
  if (old._pending) { toast('正在保存，稍等一下再改'); return; }
  const name = memberById(memberId)?.name || '';
  if (seen && attSig(seen) !== attSig(old)) {
    toast(`${name} 刚被另一台手机改成「${attText(old)}」，没有撤销`, 3600);
    return;
  }
  const backup = { ...old };
  let changed = false;
  const ok = await optimistic(
    () => removeRow('attendance', old.id),
    () => upsertRow('attendance', backup),
    async () => {
      // 只删「我看到的那一条、而且还是那个状态」：期间另一台手机刚改过，就不删
      const gone = await withRetry(async () => must(await sb.from('attendance').delete().eq('id', old.id).eq('status', old.status).select('id')));
      if (!gone || !gone.length) { changed = true; throw Object.assign(new Error('changed_elsewhere'), { code: 'PGRST116' }); }
    },
    { what: '撤销没成功', handled: () => changed, resync: true }
  );
  if (ok) toast(old.status === 'absent' ? `已删掉 ${name} 这天的「缺席」记录`
    : date < todayStr() && hadMeeting(date) && weekdayOf(date) === 0 ? `已撤销，${name} 这天算缺席` : `已撤销 ${name} 的签到`);
  else if (changed) toast('这条记录刚被另一台手机改过了，已刷新，请再看一下', 3600);
}

/* 改「几点以后算迟到」：几台手机共用一份，只影响之后的签到 */
async function setLateAfter(v) {
  const before = state.settings.find(x => x.id === 'late_after');
  const row = { id: 'late_after', value: v, updated_at: new Date().toISOString() };
  const ok = await optimistic(
    () => upsertRow('app_settings', row),
    () => before ? upsertRow('app_settings', before) : removeRow('app_settings', 'late_after'),
    async () => upsertRow('app_settings', await withRetry(async () => must(await sb.from('app_settings').upsert(row).select().single()))),
    { what: '没保存上' }
  );
  if (ok) toast(`已改好：${v} 及以后签到算「迟」`);
}

}
/* 手指（或鼠标）按下还没抬起时先不重画。
   重画会把手指底下的圆圈换成一个新的，这一下就成了「点了没反应」——
   快速连着给几个人打卡、或者另一台手机同时在操作时最容易碰到。
   抬手后马上补画；万一收不到抬手，最多等 1.5 秒。 */
const pressing = new Set();
let renderHeld = false, holdGuard = null;
function flushHeldRender() {
  if (renderHeld && !pressing.size) render();
}
addEventListener('pointerdown', e => {
  pressing.add(e.pointerId);
  clearTimeout(holdGuard);
  holdGuard = setTimeout(() => { pressing.clear(); flushHeldRender(); }, 1500);
}, true);
const lifted = e => {
  if (pressing.delete(e.pointerId) && !pressing.size) {
    clearTimeout(holdGuard);
    setTimeout(flushHeldRender, 0);     // 等这次抬手本身的处理（比如打卡）先跑完
  }
};
addEventListener('pointerup', lifted, true);
addEventListener('pointercancel', lifted, true);

      buttons: [
